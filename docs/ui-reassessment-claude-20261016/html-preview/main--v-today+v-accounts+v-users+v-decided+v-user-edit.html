<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sub2 Mobile · 主模式 · v-today+v-accounts+v-users+v-decided+v-user-edit</title><style>/* Shared structural CSS. Directions define the variables and identity overrides. */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; font-family: var(--num-font); }
.mono { font-family: var(--mono-font); font-variant-numeric: tabular-nums; }

/* ---------- preview page ---------- */
.page { min-height: 100vh; padding: 40px 48px 64px; background: var(--page-bg); color: var(--page-ink); transition: background .3s; }
.page-head { max-width: 1180px; }
.page-kicker { font-size: 12px; letter-spacing: .02em; color: var(--page-dim); }
.page-head h1 { margin: 10px 0 8px; font: var(--page-title-font, 650 34px/1.15 -apple-system, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif); }
.page-concept { margin: 0; max-width: 760px; font-size: 16px; line-height: 1.65; color: var(--page-ink); }
.page-traits { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.page-traits li { font-size: 13px; padding: 5px 10px; border: 1px solid var(--page-line); border-radius: 6px; color: var(--page-dim); }
.page-structure { margin: 18px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 0 28px; max-width: 1180px; }
.page-structure > div { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--page-line); font-size: 13.5px; line-height: 1.55; }
.page-structure dt { color: var(--page-dim); font-weight: 600; }
.page-structure dd { margin: 0; color: var(--page-ink); }
.page-controls { margin-top: 20px; display: flex; gap: 20px; align-items: center; }
.page-controls a { color: var(--page-dim); font-size: 14px; }
.page-toggle { display: inline-flex; border: 1px solid var(--page-line); border-radius: 9px; padding: 3px; }
.page-toggle button { padding: 7px 16px; border-radius: 7px; font-size: 14px; color: var(--page-dim); }
.page-toggle button.on { background: var(--page-ink); color: var(--page-bg); }
.phones { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 40px 36px; align-items: flex-start; }
.phone-cell { margin: 0; }
.phone-cell figcaption { font-size: 13px; color: var(--page-dim); margin: 0 0 12px 6px; display: flex; gap: 8px; align-items: baseline; max-width: 410px; }
.phone-cell figcaption b { font-variant-numeric: tabular-nums; color: var(--page-ink); }
.page-foot { margin-top: 40px; font-size: 12px; color: var(--page-dim); max-width: 760px; line-height: 1.6; }

/* ---------- app canvas ---------- */
.app { position: absolute; inset: 0; background: var(--canvas); color: var(--ink1); font-size: 17px; line-height: 1.3; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen-plain { background: var(--list-bg, var(--canvas)); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 108px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.scroll-dock { padding-bottom: 120px; }
.pad { padding-left: 16px; padding-right: 16px; }
.pad-x { padding: 0 16px; }
.dim { color: var(--ink3); }

/* nav (system-like; glass buttons are the only glass in the header) */
.nav { flex: none; padding-top: 54px; background: var(--nav-bg, var(--canvas)); position: relative; z-index: 5; }
.nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 12px 6px; min-height: 52px; }
.nav-spacer { width: 44px; flex: none; }
.nav-trailing { display: flex; gap: 8px; flex: none; }
.nav-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: default; }
.nav-title.has-menu { cursor: pointer; }
.nav-title-text { font-weight: 600; font-size: 17px; display: inline-flex; align-items: center; gap: 4px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-subtitle { font-size: 12.5px; color: var(--ink2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nav-large .nav-row { min-height: 50px; padding-bottom: 0; }
.nav-large-title { padding: 0 16px 10px; }
.large-title { font: var(--large-title-font); display: inline-flex; align-items: center; gap: 6px; letter-spacing: var(--large-title-track, 0); }
.large-title.has-menu svg { opacity: .55; }
.nav-large .nav-subtitle { font-size: 14px; margin-top: 2px; }

.glass, .glass-btn { background: var(--glass-bg); -webkit-backdrop-filter: blur(18px) saturate(1.7); backdrop-filter: blur(18px) saturate(1.7); box-shadow: var(--glass-shadow); border: 1px solid var(--glass-edge); }
.glass-btn { width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink1); flex: none; }
.glass-btn-text { width: auto; padding: 0 16px; font-size: 16px; font-weight: 500; }
.glass-prominent { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }

/* tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 26px; display: flex; gap: 10px; align-items: flex-end; z-index: 20; pointer-events: none; background: linear-gradient(to bottom, transparent, var(--tab-fade) 70%); }
.tabs { pointer-events: auto; flex: 1; height: 62px; border-radius: 31px; display: flex; padding: 4px; }
.tab { flex: 1; border-radius: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tab-ink); }
.tab.on { color: var(--tab-on); background: var(--tab-on-bg); }
.tab-icon { position: relative; }
.tab-label { font-size: 10.5px; font-weight: 600; }
.tab-badge { position: absolute; top: -5px; right: -10px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #FF3B30; color: #fff; font-size: 11px; line-height: 17px; text-align: center; font-weight: 700; font-family: inherit; }
.tab-search { pointer-events: auto; width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; color: var(--tab-ink); flex: none; }
.tab-search.on { color: var(--tab-on); }

/* toast */
.toast { position: absolute; left: 20px; right: 20px; bottom: 102px; z-index: 30; border-radius: 26px; min-height: 52px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 10px; animation: toast-in .28s cubic-bezier(.2,.9,.3,1.2); }
.toast-icon { color: var(--tone); }
.toast-text { flex: 1; font-size: 15px; font-weight: 500; }
.toast-undo { padding: 8px 14px; border-radius: 18px; font-weight: 600; color: var(--accent); font-size: 15px; }
@keyframes toast-in { from { transform: translateY(14px); opacity: 0; } }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 40; }
.overlay-dim { background: rgba(0,0,0,.28); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.menu { position: absolute; top: 112px; left: 50%; transform: translateX(-50%); width: 260px; border-radius: 22px; padding: 6px; animation: pop .2s ease-out; transform-origin: top center; }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(.94); } }
.menu-item { width: 100%; display: flex; gap: 8px; align-items: center; padding: 11px 12px; border-radius: 14px; font-size: 16px; }
.menu-item:hover { background: var(--hover); }
.menu-check { width: 18px; color: var(--accent); }
.menu-label { display: flex; flex-direction: column; }
.menu-label small { color: var(--ink2); font-size: 12.5px; }
.menu-sep { height: 1px; background: var(--hairline); margin: 4px 10px; }
.dialog { position: absolute; left: 40px; right: 40px; top: 50%; transform: translateY(-50%); border-radius: 28px; padding: 22px 20px 14px; text-align: center; animation: pop2 .22s ease-out; }
@keyframes pop2 { from { opacity: 0; transform: translateY(-50%) scale(1.06); } }
.dialog-title { font-size: 17px; font-weight: 600; line-height: 1.35; }
.dialog-message { margin-top: 8px; font-size: 14px; color: var(--ink2); white-space: pre-line; line-height: 1.5; }
.dialog-actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.dialog-btn { height: 48px; border-radius: 24px; background: var(--hover); font-size: 17px; font-weight: 600; text-align: center; color: var(--ink1); }
.dialog-btn.role-default { background: var(--accent-fill); color: var(--on-accent); }
.dialog-btn.role-destructive { background: #FF3B30; color: #fff; }
.dialog-btn.role-cancel { font-weight: 500; }

/* sheet */
.sheet-overlay { display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 82%; background: var(--sheet-bg); border-radius: 34px 34px 0 0; padding: 6px 0 30px; display: flex; flex-direction: column; animation: sheet-in .32s cubic-bezier(.2,.9,.3,1); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.sheet-tall { height: 86%; max-height: none; }
@keyframes sheet-in { from { transform: translateY(100%); } }
.sheet-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .45; margin: 0 auto 4px; }
.sheet-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 10px; }
.sheet-title { font-weight: 600; font-size: 17px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-target { display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
.sheet-target small { font-weight: 400; color: var(--ink2); font-size: 13px; }
.stream { margin: 0; padding: 14px; border-radius: 14px; background: var(--sunken); font-size: 13.5px; line-height: 1.7; min-height: 150px; white-space: pre-wrap; color: var(--ink1); }
.result { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--tone-wash); color: var(--tone-ink); font-size: 15px; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 4px; padding: 18px 0 6px; border-bottom: 1px solid var(--hairline); }
.amount-sign { font: var(--amount-sign-font); color: var(--ink2); }
.amount input { width: 200px; border: 0; background: none; font: var(--amount-font); text-align: left; outline: none; font-variant-numeric: tabular-nums; color: var(--ink1); }
.amount input::placeholder { color: var(--ink3); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.note { height: 46px; border-radius: 12px; border: 0; background: var(--sunken); padding: 0 14px; font-size: 16px; outline: none; }
.preview { text-align: center; font-size: 15px; color: var(--ink2); display: flex; gap: 6px; justify-content: center; align-items: baseline; }
.preview.tone-critical { color: var(--tone-ink); }
.submit { margin-top: auto; height: 54px; border-radius: 27px; background: var(--accent-fill); color: var(--on-accent); font-size: 17px; font-weight: 600; text-align: center; }
.submit:disabled { background: var(--hover); color: var(--ink3); }
.picker-group { font-size: 13px; font-weight: 600; color: var(--ink2); margin-top: 6px; }
.sheet .row { margin: 0 -16px; }

/* chips & segmented */
.chips { display: flex; gap: 8px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 13px; border-radius: var(--chip-radius, 17px); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14.5px; background: var(--chip-bg); color: var(--ink1); flex: none; border: 1px solid var(--chip-edge, transparent); }
.chip b { font-weight: 600; font-size: 13.5px; color: var(--ink2); }
.chip.on { background: var(--chip-on-bg); color: var(--chip-on-ink); border-color: var(--chip-on-edge, transparent); }
.chip.on b { color: inherit; }
.chip-alert b { color: var(--critical-ink); }
.chip.on.chip-alert b { color: inherit; }
.token-add { background: transparent; border: 1px dashed var(--ink3); color: var(--ink2); }
.seg { display: flex; padding: 3px; border-radius: 12px; background: var(--chip-bg); gap: 2px; }
.seg-item { flex: 1; height: 34px; border-radius: 9px; font-size: 14px; font-weight: 500; text-align: center; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg-item.on { background: var(--seg-on-bg); color: var(--ink1); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg-count { font-size: 12.5px; opacity: .7; }

/* section */
.sec-wrap { margin: 0 16px 22px; }
.sec { background: var(--surface); border-radius: var(--panel-radius); overflow: hidden; }
.sec-plain { background: transparent; }
.sec-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; }
.sec-index { display: none; }
.sec-title { font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.sec-line { flex: 1; }
.sec-meta { font-size: 12.5px; color: var(--ink3); }

/* row */
.row { position: relative; display: flex; gap: 10px; padding: 11px 16px; align-items: flex-start; }
.row + .row::before, .list-group .row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: 44px; height: 1px; background: var(--hairline); transform: scaleY(var(--hairline-scale, .5)); }
.row.tappable { cursor: pointer; }
.row.tappable:hover { background: var(--hover-row); }
.row-lead { width: 22px; flex: none; display: flex; justify-content: center; padding-top: 1px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-chev { color: var(--ink3); padding-top: 4px; opacity: .7; }
.row-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-width: 0; }
.row-title { font-size: 16.5px; font-weight: var(--row-title-weight, 600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row-title.model { font-family: var(--mono-font); font-size: 15px; font-weight: 500; }
.row-sub { font-size: 13px; font-weight: 400; color: var(--ink3); margin-left: 6px; }
.row-right { flex: none; font-size: 15px; }
.row-meta { font-size: 14px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: baseline; flex-wrap: nowrap; }
.row-note { font-size: 13.5px; color: var(--tone-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.row-cap { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.row-money { display: inline-flex; gap: 5px; align-items: baseline; }
.row-money small { font-size: 12px; color: var(--ink3); }
.cap-missing { font-size: 13px; color: var(--ink3); }
.lead-icon { color: var(--tone-ink, var(--ink2)); display: flex; }
.lead-icon.dim { color: var(--ink2); }
.is-idle .row-title { color: var(--ink2); }
.is-selected { background: var(--accent-wash); }
.select-ring { width: 22px; height: 22px; border-radius: 11px; border: 1.8px solid var(--ink3); display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.select-ring.on { background: var(--accent-fill); border-color: var(--accent-fill); }
.avatar { width: 30px; height: 30px; margin-left: -4px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: var(--chip-bg); font-size: 14px; font-weight: 600; color: var(--ink2); }
.list-group { background: var(--surface); }
.list-head { display: flex; justify-content: space-between; padding: 14px 16px 6px; font-size: 13.5px; font-weight: 600; color: var(--ink2); background: var(--list-head-bg, var(--canvas)); }
.list-head b { font-weight: 500; color: var(--ink3); }
.empty { padding-top: 18px; padding-bottom: 18px; color: var(--ink3); font-size: 14px; text-align: center; }
.search-field { margin: 4px 16px 10px; height: 40px; border-radius: 12px; background: var(--chip-bg); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink3); font-size: 16px; }
.search-field input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; }
.search-field.big { height: 46px; border-radius: 23px; }

/* tone plumbing */
.tone-ok { --tone: var(--ok); --tone-ink: var(--ok-ink); --tone-wash: var(--ok-wash); }
.tone-caution { --tone: var(--caution); --tone-ink: var(--caution-ink); --tone-wash: var(--caution-wash); }
.tone-critical { --tone: var(--critical); --tone-ink: var(--critical-ink); --tone-wash: var(--critical-wash); }
.tone-neutral { --tone: var(--neutral); --tone-ink: var(--neutral-ink); --tone-wash: var(--neutral-wash); }
.tone-model { --tone: var(--model); --tone-ink: var(--model-ink); --tone-wash: var(--model-wash); }
.tone-text { color: var(--tone-ink); }

/* badge / glyph */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: var(--badge-radius, 6px); font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: none; background: var(--tone-wash); color: var(--tone-ink); }
.badge-big { height: 28px; padding: 0 10px; font-size: 14px; }
.badge-time { font-weight: 600; }
.glyph { color: var(--tone); display: flex; align-items: center; justify-content: center; height: 22px; }
.glyph-normal { color: var(--ok); }

/* money / readouts */
.money { font-family: var(--money-font); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: var(--money-weight, 600); }
.money-s { font-size: 14px; font-weight: var(--money-s-weight, 500); }
.money-m { font-size: 16.5px; }
.money-l { font-size: 21px; }
.money-xl { font: var(--money-xl-font); letter-spacing: var(--money-xl-track, 0); }
.money.is-missing { color: var(--ink3); }
.readout { font-family: var(--readout-font); font-weight: var(--readout-weight, 600); }
.readout-xl { font-size: 46px; line-height: 1.05; letter-spacing: var(--readout-xl-track, -.01em); }
.readout-l { font-size: 24px; }

/* capacity */
.cap { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.cap-track { position: relative; width: 92px; height: var(--cap-h, 6px); border-radius: var(--cap-radius, 3px); background: var(--track); overflow: hidden; flex: none; }
.cap-wide { flex: 1; }
.cap-wide .cap-track { flex: 1; width: auto; }
.cap-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cap-normal); border-radius: inherit; }
.cap-caution .cap-fill { background: var(--caution); }
.cap-critical .cap-fill { background: var(--critical); }
.cap-read { font-size: 13.5px; color: var(--ink1); white-space: nowrap; }
.cap-unit { color: var(--ink3); font-family: inherit; }
.cap-line { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.cap-line + .cap-line { border-top: 1px solid var(--hairline-soft, var(--hairline)); }
.cap-label { width: 80px; flex: none; font-size: 14.5px; color: var(--ink2); }
.cap-note { font-size: 11.5px; color: var(--ink3); }

/* today / strip */
.strip { margin: 2px 16px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.strip-main { display: flex; flex-direction: column; gap: 2px; }
.strip-main small, .strip-side small { font-size: 12.5px; color: var(--ink2); }
.strip-delta { font-size: 13px; color: var(--ink2); display: inline-flex; align-items: center; gap: 3px; }
.strip-side { display: flex; gap: 18px; padding-bottom: 4px; }
.strip-side span { display: flex; flex-direction: column; align-items: flex-end; }
.strip-side b { font-size: 19px; font-weight: 600; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.chart-title { font-size: 14px; font-weight: 600; }
.chart-legend { font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; }
.chart-legend i { display: inline-block; width: 12px; height: 2.5px; border-radius: 2px; margin-left: 6px; }
.lg-today { background: var(--chart-main); }
.lg-yest { background: transparent; border-top: 2px dashed var(--chart-compare); height: 0 !important; }
.chart-wrap { padding: 6px 12px 0; }
.chart-grid { stroke: var(--hairline); stroke-width: .6; }
.chart-base { stroke: var(--rule-strong); stroke-width: 1; }
.chart-line { fill: none; stroke: var(--chart-main); stroke-width: 2.2; stroke-linejoin: round; }
.chart-area { fill: var(--chart-area); }
.chart-end { fill: var(--chart-main); stroke: var(--surface); stroke-width: 2; }
.chart-compare { fill: none; stroke: var(--chart-compare); stroke-width: 1.3; stroke-dasharray: 3 3; }
.chart-bar { fill: var(--chart-bar); }
.chart-bar-now { fill: var(--chart-bar-now); }
.chart-axis { font-size: 9.5px; fill: var(--ink3); font-family: var(--num-font); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.grid3 > div { display: flex; flex-direction: column; gap: 3px; }
.grid3 small { font-size: 12.5px; color: var(--ink2); }
.double-rule { margin: 0 16px; height: 4px; border-top: 1px solid var(--rule-strong); border-bottom: 1px solid var(--rule-strong); opacity: var(--double-rule-opacity, 0); }
.kv-row { display: flex; gap: 18px; padding-top: 10px; padding-bottom: 12px; font-size: 14px; color: var(--ink2); flex-wrap: wrap; }
.kv-row b { color: var(--ink1); font-weight: 600; margin-left: 3px; }
.kind-actual { color: var(--money-actual); }
.kind-cost { color: var(--money-cost); }
.kind-standard { color: var(--money-standard); }

/* health */
.health { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 4px; }
.health-label { font-size: 14px; color: var(--ink2); flex: none; }
.health-scale { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--track); }
.health-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--health-fill, var(--cap-normal)); }
.health-zone { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink3); opacity: .6; }
.health-needle { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tone); border-radius: 1px; }
.health-word { font-size: 13px; font-weight: 600; }

/* detail */
.detail-head { padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.hero { border-radius: var(--panel-radius); background: var(--surface); padding: 16px 16px 16px 18px; position: relative; overflow: hidden; }
.hero-quiet { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; padding: 14px 16px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-cause { font-size: 14px; color: var(--ink2); }
.hero-figure { margin-top: 10px; }
.hero-sub { font-size: 14.5px; color: var(--ink2); margin-top: 4px; }
.hero-error { margin-top: 10px; font-size: 16px; line-height: 1.45; }
.hero-models { margin-top: 14px; padding: 10px 12px; border-radius: calc(var(--panel-radius) - 6px); background: var(--sunken); }
.hero-models-title { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--tone-ink); }
.hero-model { display: flex; justify-content: space-between; font-size: 13.5px; margin-top: 6px; color: var(--ink1); }
.hero-model .num { color: var(--ink2); }
.actions { display: flex; gap: 10px; }
.act { flex: 1; height: 46px; border-radius: var(--btn-radius, 23px); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 15.5px; font-weight: 600; background: var(--btn-bg); color: var(--btn-ink); border: 1px solid var(--btn-edge, transparent); white-space: nowrap; }
.act-primary { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
.act-small { flex: none; height: 30px; padding: 0 12px; font-size: 13.5px; border-radius: 15px; }
.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; padding-top: 6px; padding-bottom: 6px; }
.kv { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-bottom: 1px solid var(--hairline-soft, var(--hairline)); }
.kv:nth-last-child(-n+2) { border-bottom: 0; }
.kv-label { font-size: 12.5px; color: var(--ink3); }
.kv-value { font-size: 15.5px; color: var(--ink1); display: inline-flex; gap: 4px; align-items: center; }
.banner { margin: 2px 16px 14px; padding: 12px 12px 12px 16px; border-radius: 16px; background: var(--tone-wash); display: flex; gap: 10px; align-items: center; color: var(--tone-ink); position: relative; overflow: hidden; }
.banner-text { flex: 1; display: flex; flex-direction: column; gap: 2px; color: var(--ink1); }
.banner-text b { font-size: 15px; font-weight: 600; }
.banner-text span { font-size: 13px; color: var(--ink2); }
.balance-hero { padding: 0 16px 22px; display: flex; flex-direction: column; gap: 4px; }
.balance-hero > small { font-size: 13.5px; color: var(--ink2); }
.balance-sub { font-size: 14px; color: var(--ink2); margin-bottom: 14px; display: flex; gap: 4px; align-items: baseline; }
.ledger-line { padding-top: 10px; padding-bottom: 10px; }
.ledger-line + .ledger-line { border-top: 1px solid var(--hairline-soft, var(--hairline)); }
.ledger-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 15.5px; }

/* logs */
.code { width: 34px; margin-left: -6px; height: 22px; border-radius: 5px; font-family: var(--mono-font); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.code-ok { color: var(--ink3); background: transparent; }
.code-caution { color: var(--caution-ink); background: var(--caution-wash); }
.code-critical { color: var(--critical-ink); background: var(--critical-wash); }

/* monitor */
.chan-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
.chan-stat { background: var(--surface); border-radius: calc(var(--panel-radius) - 4px); padding: 10px 12px; display: flex; flex-direction: column; gap: 0; }
.chan-stat small { font-size: 12.5px; color: var(--ink2); }
.chan-stat .readout { color: var(--ink1); }
.chan-stat.tone-caution .readout, .chan-stat.tone-critical .readout { color: var(--tone-ink); }
.strip18 { display: flex; gap: 2px; margin: 3px 0 1px; }
.strip18 i { flex: 1; height: 12px; border-radius: 2px; background: var(--ok); opacity: .55; }
.strip18 .s-c { background: var(--caution); opacity: 1; }
.strip18 .s-w { background: var(--caution); opacity: .55; }
.strip18 .s-r { background: var(--critical); opacity: 1; }
.strip18 .s-n { background: var(--track); opacity: 1; }

/* dock (selection mode) */
.dock { position: absolute; left: 14px; right: 14px; bottom: 26px; z-index: 22; height: 64px; border-radius: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 20px; }
.dock-count { flex: 1; font-size: 15px; color: var(--ink2); }
.dock-count b { color: var(--ink1); }
.dock-btn { height: 46px; padding: 0 14px; border-radius: 23px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: var(--ink1); }
.dock-btn:disabled { opacity: .4; }
.dock-primary { background: var(--accent-fill); color: var(--on-accent); }
.page-bare { min-height: 0; padding: 8px; display: flex; justify-content: center; background: transparent !important; }

/* 游标 Vernier palette: graphite + one signal cyan. Colour only — every layout shares it; type and shape stay per layout. */
.page-vernier.page-light { --page-bg: #E4E8EA; --page-ink: #14181B; --page-dim: #4A545A; --page-line: #C5CCD0; }
.page-vernier.page-dark { --page-bg: #050708; --page-ink: #E7EBED; --page-dim: #A8B1B7; --page-line: #2B3237; }

.pal-vernier.light {
  --canvas: #F1F3F4; --surface: #FFFFFF; --sunken: #EBEEF0; --track: #EBEEF0;
  --hairline: #D8DDE0; --rule-strong: #7F898F;
  --ink1: #14181B; --ink2: #4A545A; --ink3: #5E686F;
  --accent: #0B6E85; --accent-fill: #0B6E85; --on-accent: #FFFFFF; --accent-wash: #E2F1F4;
  --ok: #288F48; --ok-ink: #1B7339; --ok-wash: #E5F2E9;
  --caution: #B87D00; --caution-ink: #875200; --caution-wash: #F6EFE0;
  --critical: #B42318; --critical-ink: #A61D15; --critical-wash: #F6E5E3;
  --neutral: #7D878D; --neutral-ink: #596369; --neutral-wash: #EFF1F1;
  --model: #8559E0; --model-ink: #6A3DC2; --model-wash: #F0EBFB;
  --money-actual: #14181B; --money-cost: #14181B; --money-standard: #14181B;
  --lg-actual: #288F48; --lg-cost: #CF5F17; --lg-standard: #7D878D;
  --cap-normal: #4A545A;
  --chart-main: #14181B; --chart-area: transparent; --chart-compare: #7F898F; --chart-bar: #7F898F; --chart-bar-now: #14181B;
  --chip-bg: #EBEEF0; --chip-on-bg: #E2F1F4; --chip-on-ink: #0B6E85; --chip-on-edge: #0B6E85;
  --seg-on-bg: #FFFFFF; --btn-bg: #EBEEF0; --btn-ink: #14181B;
  --nav-bg: #F1F3F4; --list-bg: #FFFFFF; --list-head-bg: #F1F3F4; --sheet-bg: #F1F3F4;
  --glass-bg: rgba(250,251,251,.72); --glass-edge: rgba(255,255,255,.7); --glass-shadow: 0 6px 24px rgba(15,25,30,.12), inset 0 1px 0 rgba(255,255,255,.8);
  --tab-ink: #14181B; --tab-on: #0B6E85; --tab-on-bg: rgba(11,110,133,.10); --tab-fade: rgba(241,243,244,.0);
  --hover: rgba(20,24,27,.06); --hover-row: rgba(20,24,27,.03);
}
.pal-vernier.dark {
  --canvas: #0B0E10; --surface: #15191C; --sunken: #1E2327; --track: #1E2327;
  --hairline: #2B3237; --rule-strong: #606A71;
  --ink1: #E7EBED; --ink2: #A8B1B7; --ink3: #8B959C;
  --accent: #52CBE6; --accent-fill: #127A91; --on-accent: #FFFFFF; --accent-wash: #203940;
  --ok: #45BE68; --ok-ink: #5BCF7E; --ok-wash: #1E372A;
  --caution: #F0B93C; --caution-ink: #F5C04F; --caution-wash: #3C3622;
  --critical: #E5483D; --critical-ink: #FF7468; --critical-wash: #3A2122;
  --neutral: #6E7980; --neutral-ink: #9CA6AC; --neutral-wash: #252A2E;
  --model: #9C7CF2; --model-ink: #BBA0FF; --model-wash: #2D2B43;
  --money-actual: #E7EBED; --money-cost: #E7EBED; --money-standard: #E7EBED;
  --lg-actual: #45BE68; --lg-cost: #EB8840; --lg-standard: #6E7980;
  --cap-normal: #A8B1B7;
  --chart-main: #E7EBED; --chart-area: transparent; --chart-compare: #606A71; --chart-bar: #606A71; --chart-bar-now: #E7EBED;
  --chip-bg: #1E2327; --chip-on-bg: #203940; --chip-on-ink: #52CBE6; --chip-on-edge: #52CBE6;
  --seg-on-bg: #2B3237; --btn-bg: #1E2327; --btn-ink: #E7EBED;
  --nav-bg: #0B0E10; --list-bg: #15191C; --list-head-bg: #0B0E10; --sheet-bg: #15191C;
  --glass-bg: rgba(38,44,48,.66); --glass-edge: rgba(255,255,255,.10); --glass-shadow: 0 8px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  --tab-ink: #E7EBED; --tab-on: #52CBE6; --tab-on-bg: rgba(82,203,230,.12); --tab-fade: rgba(11,14,16,0);
  --hover: rgba(255,255,255,.07); --hover-row: rgba(255,255,255,.03);
}

/* 游标 Vernier · tokens from design/21-visual-instrument.md */
.page-instrument {
  --page-title-font: 600 34px/1.15 "SF Pro Display", "Bahnschrift", "Segoe UI", "PingFang SC", sans-serif;
}

.dir-instrument {
  --num-font: "SF Pro Text", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --readout-font: "SF Pro Display", "Bahnschrift", "Segoe UI", sans-serif;
  --money-font: var(--num-font);
  --mono-font: "SF Mono", "Cascadia Mono", Consolas, monospace;
  --large-title-font: 700 32px/1.15 -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  --money-xl-font: 500 44px/1.05 "SF Pro Display", "Bahnschrift", sans-serif;
  --amount-font: 500 52px/1.1 "SF Pro Display", "Bahnschrift", sans-serif;
  --amount-sign-font: 400 30px/1 "SF Pro Display", "Bahnschrift", sans-serif;
  --panel-radius: 14px;
  --badge-radius: 3px;
  --chip-radius: 8px;
  --btn-radius: 10px;
  --cap-radius: 1px;
  --cap-h: 6px;
  --row-title-weight: 500;
  --readout-weight: 500;
  --money-weight: 500;
}

/* condensed readouts: SF Pro width axis on Apple, Bahnschrift condensed on Windows */
.dir-instrument .readout, .dir-instrument .money-xl, .dir-instrument .amount input, .dir-instrument .money-l { font-stretch: 75%; font-family: "SF Pro Display", "Bahnschrift", sans-serif; }
.dir-instrument .money-l { font-weight: 500; font-size: 23px; }
.dir-instrument .strip-side b { font-family: "SF Pro Display", "Bahnschrift", sans-serif; font-stretch: 75%; font-size: 21px; font-weight: 500; }

/* panels: hairline-bordered modules, no shadow */
.dir-instrument .sec { border: 1px solid var(--hairline); }
.dir-instrument .sec-head { padding-bottom: 7px; align-items: center; }
.dir-instrument .sec-title { font-size: 13px; font-weight: 600; color: var(--ink2); }
.dir-instrument .sec-line { height: 1px; background: var(--hairline); margin-top: 1px; }
.dir-instrument .sec-meta { font-weight: 500; color: var(--ink3); }

/* status spine */
.dir-instrument .rail { background: linear-gradient(to right, var(--tone) 0 3px, transparent 3px); }
.dir-instrument .rail.tappable:hover { background: linear-gradient(to right, var(--tone) 0 3px, var(--hover-row) 3px); }
.dir-instrument .list-group .row + .row::before { left: 48px; }

/* lamp plates: near-square, glyph + text, wash fill */
.dir-instrument .badge { height: 21px; padding: 0 6px; font-size: 12px; border: 0; }
.dir-instrument .badge.lv1 { background: var(--neutral-wash); color: var(--neutral-ink); }
.dir-instrument .glyph-normal svg { width: 7px; height: 7px; }

/* vernier capacity bar: notches at 25/50/75 drawn above the fill, over-limit cap */
.dir-instrument .cap-track::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to right, transparent calc(25% - .5px), var(--surface) 0 calc(25% + .5px), transparent 0 calc(50% - .5px), var(--surface) 0 calc(50% + .5px), transparent 0 calc(75% - .5px), var(--surface) 0 calc(75% + .5px), transparent 0); }
.dir-instrument .cap-over .cap-track { box-shadow: 2px 0 0 var(--critical); }

/* ledger legend ticks: the three cost bases differ by stroke; amounts stay ink */
.dir-instrument small[data-kind]::before { content: ''; display: inline-block; width: 10px; height: 0; margin-right: 5px; vertical-align: middle; border-top: 2px solid var(--lg-actual); }
.dir-instrument small[data-kind="cost"]::before { border-top: 2px dashed var(--lg-cost); }
.dir-instrument small[data-kind="standard"]::before { border-top: 2px dotted var(--lg-standard); }

/* chart: graphite bars, current hour ink, compare dotted */
.dir-instrument .chart-compare { stroke-dasharray: 1.5 3; stroke-width: 1.2; }
.dir-instrument .lg-today { height: 8px !important; width: 6px !important; border-radius: 1px; background: var(--chart-bar-now); }

/* plain hairline list rows, inline nav */
.dir-instrument .list-head { font-size: 12.5px; letter-spacing: .02em; }
.dir-instrument .chip b { font-family: var(--num-font); }
.dir-instrument .act { border: 1px solid var(--hairline); }
.dir-instrument .act-primary { border-color: transparent; }
.dir-instrument .hero { border: 1px solid var(--hairline); }
.dir-instrument .hero.rail { background: linear-gradient(to right, var(--tone) 0 3px, var(--surface) 3px); }
.dir-instrument .hero-quiet { border: 1px solid var(--hairline); }
.dir-instrument .hero .readout-xl { font-size: 52px; }
.dir-instrument .code { border-radius: 3px; }
.dir-instrument .health-fill { background: var(--ink2); }
.dir-instrument .strip18 i { border-radius: 1px; height: 10px; }
.dir-instrument .chan-stat { border: 1px solid var(--hairline); border-radius: 10px; }
.dir-instrument .search-field { border-radius: 10px; }
.dir-instrument .avatar { border-radius: 8px; }

/* 主模式补充样式：大数字键盘（来自 B）、日志行右侧固定列、请求详情。所有选择器挂在 .lay-main 下。 */

/* keypad (from B) */
.lay-main .kp-user { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 14.5px; color: var(--ink2); }
.lay-main .kp-avatar { width: 30px; height: 30px; border-radius: 15px; background: var(--sunken); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--ink1); }
.lay-main .kp-amount { text-align: center; font-size: 64px; font-weight: 500; letter-spacing: -.02em; line-height: 1.05; margin-top: 4px; font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%; }
.lay-main .kp-amount.is-empty { color: var(--ink3); }
.lay-main .kp-preview { text-align: center; font-size: 15px; color: var(--ink2); }
.lay-main .kp-preview b { color: var(--ink1); }
.lay-main .kp-pill { align-self: center; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--chip-bg); color: var(--ink1); font-size: 14px; font-weight: 600; }
.lay-main .kp-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.lay-main .kp-key { height: 54px; border-radius: 14px; font-size: 26px; font-weight: 500; display: flex; align-items: center; justify-content: center; color: var(--ink1); }
.lay-main .kp-key:hover { background: var(--hover); }
.lay-main .kp-key:active { background: var(--sunken); }
.lay-main .sheet .submit { margin-top: 4px; }

/* log row: model + who on the left; amount and "首字/耗时 · 时间" pinned right */
.lay-main .lg-row { align-items: center; padding-top: 9px; padding-bottom: 9px; }
.lay-main .lg-row .row-lead { padding-top: 0; align-self: center; }
.lay-main .lg-row .row-chev { padding-top: 0; }
.lay-main .lg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .lg-model { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .lg-who { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .lg-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; min-width: 96px; }
.lay-main .lg-cost { font-size: 15px; font-weight: 600; color: var(--ink1); }
.lay-main .lg-cost.is-missing { color: var(--ink3); font-weight: 500; }
.lay-main .lg-time { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.lay-main .lg-head-cols { font-size: 11.5px; font-weight: 500; }

/* request detail */
.lay-main .rq-status { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; color: var(--tone-ink); }
.lay-main .rq-status.ok { color: var(--ok-ink); }
.lay-main .rq-model { font-size: 19px; font-weight: 600; margin-top: 10px; word-break: break-all; }
.lay-main .rq-map { display: flex; gap: 8px; font-size: 13px; color: var(--ink2); margin-top: 4px; }
.lay-main .rq-map .mono { color: var(--ink1); word-break: break-all; }
.lay-main .rq-cost { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); }
.lay-main .rq-cost > div { display: flex; flex-direction: column; gap: 2px; }
.lay-main .rq-cost small { font-size: 12px; color: var(--ink2); }
.lay-main .rq-cost b { font-size: 22px; font-weight: 500; font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%; }
.lay-main .rq-cost span.num { font-size: 15px; color: var(--ink1); }
.lay-main .rq-error { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--sunken); font-size: 13px; line-height: 1.5; color: var(--ink1); word-break: break-word; }
.lay-main .rq-timing { padding-top: 14px; padding-bottom: 12px; }
.lay-main .rq-bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--track); }
.lay-main .rq-bar-first { background: var(--accent); }
.lay-main .rq-bar-rest { flex: 1; background: var(--ink3); opacity: .35; }
.lay-main .rq-timing-legend { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 10px; }
.lay-main .rq-timing-legend span { display: flex; flex-direction: column; gap: 2px; }
.lay-main .rq-timing-legend small { font-size: 12px; color: var(--ink2); }
.lay-main .rq-timing-legend small::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; background: transparent; }
.lay-main .rq-timing-legend span:nth-child(1) small::before { background: var(--accent); }
.lay-main .rq-timing-legend span:nth-child(2) small::before { background: var(--ink3); opacity: .5; }
.lay-main .rq-timing-legend b { font-size: 16px; font-weight: 600; }
.lay-main .rq-step { width: 22px; height: 22px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.lay-main .rq-step.ok { background: var(--ok-wash); color: var(--ok-ink); }
.lay-main .rq-step.bad { background: var(--critical-wash); color: var(--critical-ink); }
.lay-main .rq-rid { font-size: 12.5px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.lay-main .rq-saved { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13.5px; font-weight: 600; color: var(--ok-ink); }
.lay-main .lg-lead { width: 44px; flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.lay-main .lg-clock { font-size: 13px; font-weight: 600; color: var(--ink1); line-height: 18px; }
.lay-main .lg-lead .code { margin-left: -2px; height: 18px; width: 34px; justify-content: flex-start; font-size: 11.5px; }
.lay-main .lg-lead .code-caution, .lay-main .lg-lead .code-critical { justify-content: center; }
.lay-main .lg-row .lg-main, .lay-main .lg-row .lg-side { align-self: stretch; justify-content: space-between; }
.lay-main .st-radio { width: 22px; height: 22px; border-radius: 11px; border: 1.8px solid var(--ink3); display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); }
.lay-main .st-radio.on { background: var(--accent-fill); border-color: var(--accent-fill); }
.lay-main .mo-seg { margin-bottom: 14px; }
.lay-main .mo-meters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding-top: 12px; }
.lay-main .mo-meter { display: flex; flex-direction: column; gap: 6px; }
.lay-main .mo-meter-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--ink2); }
.lay-main .mo-meter-top b { font-size: 20px; color: var(--ink1); font-weight: 500; }
.lay-main .mo-meter .cap-read { display: none; }

/* 账号列表 · 第 2 轮变体（v-accounts）。所有选择器挂在 .lay-main 下，类名前缀 va-。 */

/* ---------- 导航：标题固定在正中（SwiftUI .principal），不随左右按钮宽度偏移 ---------- */
.lay-main .nav-row:has(.va-lead) { position: relative; }

/* ---------- 可收起的组头（按平台 / 按分组）：整条是一个按钮，告警牌和全选是并列的独立按钮 ---------- */
.lay-main .va-head { position: relative; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 12px 6px 16px; background: var(--list-head-bg, var(--canvas)); user-select: none; }

.lay-main .va-flag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 3px; background: var(--tone-wash); color: var(--tone-ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: none; }
.lay-main .va-head-chev { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--ink3); transition: transform .2s ease, color .15s; pointer-events: none; }

.lay-main .va-selall { height: 44px; margin: -8px -4px -8px 0; padding: 0 8px; color: var(--accent); font-size: 14.5px; font-weight: 600; white-space: nowrap; flex: none; }
.lay-main .va-picked { font-size: 13px; color: var(--accent); white-space: nowrap; flex: none; }
.lay-main .va-picked b { font-weight: 600; }

/* 告警牌按钮：视觉仍是牌子，热区 44pt 高 */
.lay-main .va-alert-btn { display: inline-flex; align-items: center; height: 44px; min-width: 44px; margin: -11px 0; padding: 0 2px; flex: none; border-radius: 8px; }

/* 告警处置面板 */
.lay-main .va-alert-card { position: relative; overflow: hidden; padding: 12px 14px 12px 17px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 4px; }

/* group availability: proportional state strip + 可用 x/y */

.lay-main .va-bar-ok { background: var(--ok); }
.lay-main .va-bar-caution { background: var(--caution); }

/* ---------- 行样式 · 共用 ---------- */

/* round 4: header flag for blocked accounts that were also stopped by hand (neutral, never the alarm colours) */

/* 首页（今日）变体：营收区位置、待处理粒度、平静态，以及首页下钻的分组账号与告警详情。所有选择器挂在 .lay-main 下，类名前缀 vt-。 */

/* big condensed figures (same family as the instrument readouts). SwiftUI: .minimumScaleFactor(0.5).lineLimit(1) */
.lay-main .vt-figure { font-family: "SF Pro Display", "Bahnschrift", sans-serif; font-stretch: 75%; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05; color: var(--ink1); white-space: nowrap; }

/* calm mode is a home-screen what-if: hide the live error badge on the 账号 tab while it is shown */
.lay-main:has(.vt-calm-flag) .tab-badge { display: none; }

/* small inline buttons keep a 30px look but get a 44px hit area (SwiftUI: .frame(minHeight: 44) + .contentShape) */
.lay-main .vt-hit .act-small { position: relative; }
.lay-main .vt-hit .act-small::after { content: ''; position: absolute; left: -5px; right: -5px; top: -8px; bottom: -8px; } /* 28px padding box + 16 = 44 */

/* ---------- chart ---------- */
.lay-main .vt-plot { position: relative; }
.lay-main .vt-chart { display: block; overflow: visible; }

.lay-main .vt-chart-bar { fill: var(--chart-bar); }
.lay-main .vt-chart-bar.is-now { fill: var(--chart-bar-now); }
.lay-main .vt-plot-legend { position: absolute; left: 0; top: -4px; }
.lay-main .vt-plot-end { position: absolute; right: 0; margin-top: 5px; font-size: 12px; line-height: 14px; color: var(--ink2); white-space: nowrap; }
.lay-main .vt-axis { position: relative; height: 16px; margin-top: 5px; font-size: 12px; color: var(--ink3); }
.lay-main .vt-axis span { position: absolute; top: 0; white-space: nowrap; line-height: 16px; }
.lay-main .vt-axis .vt-axis-now { transform: translateX(-50%); color: var(--ink1); font-weight: 600; }
.lay-main .vt-legend { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.lay-main .vt-key { display: inline-block; width: 12px; height: 0; border-top: 2px solid var(--chart-main); margin-left: 6px; }
.lay-main .vt-key:first-child { margin-left: 0; }
.lay-main .vt-key.is-bar { width: 6px; height: 10px; border-top: 0; border-radius: 1px; background: var(--chart-bar-now); }
.lay-main .vt-key.yest { border-top: 2px dotted var(--chart-compare); }

/* cost bases row (成本 / 标准 / 差额): plain labels, no line markers */

.lay-main .vt-bases span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lay-main .vt-bases small { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.lay-main .vt-bases b { font-family: "SF Pro Display", "Bahnschrift", sans-serif; font-stretch: 75%; font-size: 19px; font-weight: 500; color: var(--ink1); white-space: nowrap; }

/* ---------- 顶部大数 + 图 ---------- */
.lay-main .vt-hero { margin: 0 16px 22px; display: flex; flex-direction: column; }
.lay-main .vt-hero-label { font-size: 12.5px; color: var(--ink2); }

.lay-main .vt-usage { display: grid; grid-template-columns: repeat(4, 1fr); padding: 12px 0; }

.lay-main .vt-usage span + span { border-left: 1px solid var(--hairline); }

/* ---------- B 式营收卡 ---------- */

.lay-main .vt-rev-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--hairline); }
.lay-main .vt-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.lay-main .vt-tile { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--panel-radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }

/* ---------- 按分组聚合 ---------- */

.lay-main .vt-grp-alert { margin: 8px 0 0 48px; width: calc(100% - 48px); padding: 6px 16px 6px 0; min-height: 44px; display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.lay-main .vt-grp-alert:hover .vt-grp-alert-text b { text-decoration: underline; text-underline-offset: 3px; }
.lay-main .vt-grp-alert .badge { margin-top: -1px; }
.lay-main .vt-grp-alert .row-chev { padding-top: 2px; }
.lay-main .vt-grp-alert-icon { color: var(--tone-ink); display: flex; flex: none; padding-top: 1px; }

/* edit / new pages hide the tab bar (SwiftUI .toolbar(.hidden, for: .tabBar)) */

/* ---------- form rows ---------- */

}

/* small inline buttons keep a 44pt hit area around a compact pill */

/* ---------- placeholders for capabilities the backend lacks ---------- */

.lay-main .ue-seg-bad { flex: none; width: 16px; height: 16px; border-radius: 8px; background: var(--critical); color: #fff; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }

/* key cards: tap the head to expand details and actions */

/* 第 2 轮 · 用户变体（v-users）：钱包卡、紧凑头部 + 流水在前、右侧固定列（状态用三种形状）、快捷充值头像。所有选择器挂在 .lay-main 下。 */

/* balance readout: condensed numerals, currency and cents set smaller */
.lay-main .vu-bal { font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; line-height: 1; }

.lay-main .vu-bal-cur { font-size: .5em; vertical-align: .78em; margin-right: .06em; }
.lay-main .vu-bal-cents { font-size: .56em; margin-left: .02em; }
.lay-main .vu-bal-sep { font-size: .6em; margin: 0 .03em 0 .01em; }
.lay-main .vu-bal-xl { font-size: 64px; }
.lay-main .vu-bal-m { font-size: 34px; }

.lay-main .vu-hero-flag { display: inline-flex; align-self: center; margin-left: 6px; }

/* ---------- 钱包卡（B 式）：浅色用石墨底白字，深色用抬升一级的面板 ---------- */
.lay-main .vu-wallet {
  --vw-bg: var(--ink1); --vw-ink: var(--surface); --vw-dim: rgba(255, 255, 255, .72); --vw-rule: rgba(255, 255, 255, .16);
  --vw-btn: rgba(255, 255, 255, .14); --vw-btn-ink: var(--surface); --vw-pri: var(--surface); --vw-pri-ink: var(--ink1);
  position: relative; overflow: hidden; margin: 2px 16px 16px; padding: 22px 18px 16px; border-radius: 24px; color: var(--vw-ink);
  background: radial-gradient(130% 100% at 100% 0%, rgba(255, 255, 255, .10), transparent 58%), var(--vw-bg);
  box-shadow: 0 14px 30px rgba(20, 24, 27, .20), 0 2px 6px rgba(20, 24, 27, .10);
}
.lay-main.dark .vu-wallet {
  --vw-bg: var(--sunken); --vw-ink: var(--ink1); --vw-dim: var(--ink2); --vw-rule: rgba(255, 255, 255, .10);
  --vw-btn: rgba(255, 255, 255, .08); --vw-btn-ink: var(--ink1); --vw-pri: var(--ink1); --vw-pri-ink: var(--canvas);
  background: radial-gradient(130% 100% at 100% 0%, rgba(255, 255, 255, .06), transparent 58%), var(--vw-bg);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07), 0 14px 30px rgba(0, 0, 0, .40);
}
/* vernier scale hanging from the top edge: the palette's namesake, kept faint */
.lay-main .vu-wallet::before {
  content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 7px; pointer-events: none;
  background: repeating-linear-gradient(to right, var(--vw-rule) 0 1px, transparent 1px 7px);
  -webkit-mask: linear-gradient(to right, transparent, #000 20%, #000 80%, transparent); mask: linear-gradient(to right, transparent, #000 20%, #000 80%, transparent);
}
.lay-main .vu-wallet.is-disabled .vu-bal { opacity: .6; }
.lay-main .vu-wallet-top { display: flex; align-items: center; gap: 11px; }
.lay-main .vu-wallet-avatar { width: 40px; height: 40px; border-radius: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--vw-btn); font-size: 17px; font-weight: 600; }
.lay-main .vu-wallet-id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.lay-main .vu-wallet-id b { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-wallet-id small { font-size: 13px; color: var(--vw-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-wallet-tag { flex: none; height: 24px; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; background: var(--vw-btn); color: var(--vw-dim); }
.lay-main .vu-wallet-tag.is-low { background: var(--caution-wash); color: var(--caution-ink); }
.lay-main .vu-wallet-label { display: block; margin-top: 24px; margin-bottom: 4px; font-size: 13px; color: var(--vw-dim); }
.lay-main .vu-wallet-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--vw-rule); }
.lay-main .vu-wallet-stats span { display: flex; flex-direction: column; gap: 2px; }
.lay-main .vu-wallet-stats small { font-size: 12.5px; color: var(--vw-dim); }
.lay-main .vu-wallet-stats b { font-size: 19px; font-weight: 500; font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%; }
.lay-main .vu-wallet-actions { display: flex; gap: 10px; margin-top: 16px; }
.lay-main .vu-pill { flex: 1; height: 46px; border-radius: 23px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 15.5px; font-weight: 600; background: var(--vw-btn); color: var(--vw-btn-ink); }
.lay-main .vu-pill.primary { background: var(--vw-pri); color: var(--vw-pri-ink); }
.lay-main .vu-pill:active { opacity: .82; }
.lay-main .vu-banner + .vu-head { margin-top: 0; }
/* nav title fades in once the card's name row has scrolled under the bar */
.lay-main .vu-navtitle { opacity: 0; transform: translateY(5px); transition: opacity .2s ease, transform .2s ease; }
.lay-main .vu-navtitle.is-shown { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .lay-main .vu-navtitle { transition: none; transform: none; } }

/* ---------- 紧凑头部：余额与按钮一行、今日/本月是面板第二行，流水在前 ---------- */
.lay-main .vu-head { margin: 4px 16px 20px; padding: 12px 12px 0 16px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; }

.lay-main .vu-lg-icon { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: var(--sunken); color: var(--ink2); }

/* ---------- 列表 · 右侧固定列 ---------- */
.lay-main .vu-urow { align-items: center; padding-top: 10px; padding-bottom: 10px; }
.lay-main .vu-urow .row-lead { padding-top: 0; }
.lay-main .vu-urow .row-chev { padding-top: 0; }
.lay-main .vu-urow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .vu-urow-mail { font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-urow-side { flex: none; min-width: 92px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.lay-main .vu-urow-bal { display: inline-flex; align-items: center; gap: 7px; }
.lay-main .vu-urow-bal b { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main .vu-urow.is-idle .vu-urow-bal b { color: var(--ink2); }
.lay-main .vu-urow-today { font-size: 13px; color: var(--ink2); white-space: nowrap; }
.lay-main .vu-dot { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--tone); }
.lay-main .vu-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; color: var(--tone); }
.lay-main .vu-cols-head { align-items: center; }
.lay-main .vu-legend { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; }
.lay-main .vu-legend > span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- 列表 · 快捷充值头像 ---------- */
.lay-main .vu-quick { padding: 2px 0 14px; }
.lay-main .vu-quick-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 18px 6px; }
.lay-main .vu-quick-head span { font-size: 13px; font-weight: 600; color: var(--ink2); }
.lay-main .vu-quick-head small { font-size: 12.5px; color: var(--ink3); }
.lay-main .vu-quick-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 10px; }
.lay-main .vu-q { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 14px; }
.lay-main .vu-q:hover { background: var(--hover-row); }
.lay-main .vu-q:active { background: var(--hover); }
.lay-main .vu-q-avatar { position: relative; width: 52px; height: 52px; border-radius: 26px; display: inline-flex; align-items: center; justify-content: center; background: var(--sunken); font-size: 20px; font-weight: 600; color: var(--ink1); margin-bottom: 2px; }
.lay-main .vu-q.is-flag .vu-q-avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--tone); }
.lay-main .vu-q-badge { position: absolute; right: -3px; bottom: -3px; width: 21px; height: 21px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-fill); color: var(--on-accent); box-shadow: 0 0 0 2.5px var(--surface); }
.lay-main .vu-q.is-pending .vu-q-badge { background: var(--caution); color: var(--surface); }
.lay-main .vu-q-name { max-width: 100%; font-size: 13px; font-weight: 600; color: var(--ink1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-q-sub { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.lay-main .vu-q.is-flag .vu-q-sub { color: var(--tone-ink); }
