.lay-main .ledger-note { color: var(--ink2); }
.lay-main .lg-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 26px; padding-bottom: 26px; text-align: center; font-size: 14px; color: var(--ink2); }
.lay-main .lg-empty-dash { font-size: 28px; line-height: 1; font-weight: 500; color: var(--ink3); }
.lay-main .lg-empty-clear { margin-top: 4px; min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 15px; font-weight: 600; color: var(--accent); }
.lay-main .lg-empty-clear:hover { background: var(--accent-wash); }
.lay-main .rq-status.is-upstream { color: var(--ink2); gap: 8px; }
.lay-main .rq-status.is-upstream .code { margin-left: 0; width: auto; padding: 0 7px; font-size: 13px; }
.lay-main .rq-step.caution { background: var(--caution-wash); color: var(--caution-ink); }
.lay-main .st-wrap .row-meta { display: block; white-space: normal; line-height: 1.45; }
/* Plain-text meta lines that can outgrow one line (alert names, alert rule + window): wrap instead of being cut mid-word (a flex box cannot ellipsize). */
.lay-main .row-meta.mo-wrap { display: block; white-space: normal; line-height: 1.45; }

/* round-5 core: test result, last upstream error, filters a list cannot take, ledger items without an amount, hit areas */
.lay-main .kp-pill::after { content: ''; position: absolute; left: 0; right: 0; top: calc(50% - 22px); height: 44px; }
.lay-main .ts-result { align-items: flex-start; }
.lay-main .ts-result svg { margin-top: 1px; }
.lay-main .ts-result-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.lay-main .ts-result-text small { font-size: 13.5px; line-height: 1.45; color: var(--ink1); }
.lay-main .ts-result-act { position: relative; flex: none; align-self: center; min-height: 36px; padding: 0 14px; border-radius: 18px; background: var(--accent-fill); color: var(--on-accent); font-size: 14.5px; font-weight: 600; }
.lay-main .ts-result-act::after { content: ''; position: absolute; left: 0; right: 0; top: calc(50% - 22px); height: 44px; }
.lay-main .hero-last { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 44px; margin-top: 10px; padding: 0; border-top: 1px solid var(--hairline); font-size: 13.5px; color: var(--ink2); text-align: left; }
.lay-main .hero-last b { color: var(--ink1); font-weight: 600; }
.lay-main .hero-last + .hero-sched { margin-top: 0; }
.lay-main .hero-last svg { color: var(--ink3); }
.lay-main .token-off { background: var(--chip-bg); color: var(--ink3); border-color: var(--hairline); border-style: dashed; }
.lay-main .token-off .mono { text-decoration: line-through; }
.lay-main .lg-filter-note { margin: -4px 0 8px; font-size: 13px; line-height: 1.45; color: var(--ink2); }
.lay-main .ledger-display { font-size: 15.5px; font-weight: 600; color: var(--ink1); }
.lay-main .mo-silenced { align-items: center; color: var(--neutral-ink); }
.lay-main .mo-silenced svg { flex: none; }

/* 账号列表 · 第 2 轮变体（v-accounts）。所有选择器挂在 .lay-main 下，类名前缀 va-。 */

/* ---------- 导航：标题固定在正中（SwiftUI .principal），不随左右按钮宽度偏移 ---------- */
.lay-main .nav-row:has(.va-lead) { position: relative; }
.lay-main .nav-row:has(.va-lead) .nav-title { position: absolute; left: 50%; transform: translateX(-50%); width: 190px; flex: none; }
.lay-main .va-lead { display: inline-flex; flex: none; }
.lay-main .va-menu-btn { position: relative; }
.lay-main .va-menu-btn.is-on::after { content: ''; position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 0 1.5px var(--glass-bg); }

/* ---------- 可收起的组头（按平台 / 按分组）：整条是一个按钮，告警牌和全选是并列的独立按钮 ---------- */
.lay-main .va-head { position: relative; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 12px 6px 16px; background: var(--list-head-bg, var(--canvas)); user-select: none; }
.lay-main .va-section + .va-section .va-head { box-shadow: inset 0 1px 0 var(--hairline); }
.lay-main .va-head-hit { position: absolute; inset: 0; z-index: 0; width: 100%; background: transparent; border: 0; cursor: pointer; }
.lay-main .va-head-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.lay-main .va-head > button:not(.va-head-hit) { position: relative; z-index: 1; }
.lay-main .va-head:hover .va-head-chev { color: var(--ink1); }
.lay-main .va-head-part { display: contents; }
.lay-main .va-gicon { width: 26px; height: 26px; border-radius: 7px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--hairline); color: var(--ink2); }
.lay-main .va-gicon.is-none { background: transparent; border-style: dashed; color: var(--ink3); }
.lay-main .va-head-title { font-size: 15px; font-weight: 600; color: var(--ink1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lay-main .va-head-count { font-size: 13px; font-weight: 500; color: var(--ink3); white-space: nowrap; }
.lay-main .va-head-spacer { flex: 1; min-width: 4px; }
.lay-main .va-head .badge { flex: none; }
.lay-main .va-flag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 3px; background: var(--tone-wash); color: var(--tone-ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: none; }
.lay-main .va-head-chev { width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--ink3); transition: transform .2s ease, color .15s; pointer-events: none; }
.lay-main .va-head.is-collapsed .va-head-chev { transform: rotate(-90deg); }
.lay-main .va-head.is-collapsed { padding-bottom: 10px; }
.lay-main .va-selall { height: 44px; margin: -8px -4px -8px 0; padding: 0 8px; color: var(--accent); font-size: 14.5px; font-weight: 600; white-space: nowrap; flex: none; }
.lay-main .va-picked { font-size: 13px; color: var(--accent); white-space: nowrap; flex: none; }
.lay-main .va-picked b { font-weight: 600; }

/* 告警牌按钮：视觉仍是牌子，热区 44pt 高 */
.lay-main .va-alert-btn { display: inline-flex; align-items: center; height: 44px; min-width: 44px; margin: -11px 0; padding: 0 2px; flex: none; border-radius: 8px; }
.lay-main .va-alert-btn .badge { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone-ink) 22%, transparent); }
.lay-main .va-alert-btn:hover .badge { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tone-ink) 45%, transparent); }

/* 告警处置面板 */
.lay-main .va-alert-card { position: relative; overflow: hidden; padding: 12px 14px 12px 17px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 4px; }
.lay-main .va-alert-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tone); }
.lay-main .va-alert-title { font-size: 16.5px; font-weight: 600; color: var(--ink1); }
.lay-main .va-alert-detail { font-size: 14px; color: var(--ink2); }
.lay-main .va-alert-note { font-size: 13.5px; color: var(--ink2); line-height: 1.5; }
.lay-main .va-alert-link { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 2px; font-size: 15.5px; font-weight: 600; color: var(--accent); }

/* group availability: proportional state strip + 可用 x/y */
.lay-main .va-avail { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); white-space: nowrap; flex: none; }
.lay-main .va-avail b { color: var(--ink1); font-weight: 600; margin-left: 2px; }
.lay-main .va-avail.tone-caution b, .lay-main .va-avail.tone-critical b { color: var(--tone-ink); }
.lay-main .va-bar { display: inline-flex; gap: 1.5px; width: 48px; height: 6px; border-radius: 1px; overflow: hidden; background: var(--track); }
.lay-main .va-bar i { display: block; height: 100%; flex-basis: 0; min-width: 3px; }
.lay-main .va-bar-ok { background: var(--ok); }
.lay-main .va-bar-caution { background: var(--caution); }
.lay-main .va-bar-critical { background: var(--critical); }
.lay-main .va-bar-neutral { background: var(--neutral); opacity: .6; }

/* ---------- 不分组：右上“排序与筛选”菜单 ---------- */
.lay-main .va-sort-menu { left: auto; right: 12px; top: 108px; width: 240px; transform: none; transform-origin: top right; animation: va-pop .18s ease-out; }
@keyframes va-pop { from { opacity: 0; transform: scale(.94); } }
.lay-main .va-menu-title { padding: 8px 12px 4px 38px; font-size: 12.5px; font-weight: 600; color: var(--ink2); }
.lay-main .va-sort-menu .menu-item { padding-top: 9px; padding-bottom: 9px; min-height: 44px; }
.lay-main .va-menu-sub .menu-label { flex: 1; }
.lay-main .va-menu-sub > svg { color: var(--ink3); }
.lay-main .va-menu-value { font-size: 14.5px; color: var(--ink2); white-space: nowrap; }
.lay-main .va-menu-value.is-on { color: var(--accent); font-weight: 600; }
.lay-main .va-menu-back { font-weight: 600; }
.lay-main .va-sort-head span { color: var(--ink2); }

/* ---------- 行样式 · 共用 ---------- */
.lay-main .va-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .va-where { font-size: 14px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* 右侧固定列 */
.lay-main .va-side { align-items: center; padding-top: 10px; padding-bottom: 10px; }
.lay-main .va-side .row-lead, .lay-main .va-side .row-chev { padding-top: 0; align-self: center; }
.lay-main .va-right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 92px; }
.lay-main .va-right .money { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main .va-right-sub { display: flex; justify-content: flex-end; min-height: 17px; align-items: center; }
.lay-main .va-right .cap { gap: 6px; }
.lay-main .va-right .cap-track { width: 28px; }
.lay-main .va-right .cap-read { font-size: 12.5px; color: var(--ink2); }
.lay-main .va-right .cap-missing { font-size: 12.5px; }
.lay-main .va-state { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.lay-main .va-state b { font-weight: 600; margin-left: 2px; }
.lay-main .va-side.is-idle .money { color: var(--ink2); }

/* 两行紧凑 */
.lay-main .va-compact { align-items: center; padding-top: 6px; padding-bottom: 6px; }
.lay-main .va-compact .row-lead, .lay-main .va-compact .row-chev { padding-top: 0; align-self: center; }
.lay-main .va-compact .va-left { gap: 1px; }
.lay-main .va-compact .row-top { min-height: 21px; }
.lay-main .va-compact .row-title { font-size: 15.5px; line-height: 1.25; }
.lay-main .va-compact .badge { height: 20px; font-size: 12px; }
.lay-main .va-line { display: flex; align-items: baseline; gap: 3px; font-size: 14px; line-height: 1.3; color: var(--ink2); white-space: nowrap; min-width: 0; }
.lay-main .va-line .va-where { flex: 0 1 auto; }
.lay-main .va-figs { flex: none; display: inline-flex; align-items: baseline; gap: 3px; }
.lay-main .va-figs b { color: var(--ink1); font-weight: 600; }
.lay-main .va-dot { color: var(--ink3); }
.lay-main .va-compact.is-idle .va-figs b { color: var(--ink2); }

/* 平台 chip menu (SwiftUI: Menu { Picker }), dropped under the chip row; counts sit at the trailing edge */
.lay-main .va-plat-menu { top: 150px; width: 220px; }
.lay-main .va-plat-menu .menu-label { flex: 1; }
.lay-main .va-alert-link + .va-alert-link { border-top: 1px solid var(--hairline); }

/* round 4: header flag for blocked accounts that were also stopped by hand (neutral, never the alarm colours) */
.lay-main .va-flag-sched svg { flex: none; }
.lay-main .va-flag-sched + .va-flag { margin-left: -2px; }

/* 第 2 轮 · 账号详情变体（v-detail）：底部玻璃工具栏、卡内主按钮 + ⋯ 菜单、分段、折叠分区，以及三种摆法共用的新区块
   （上游用量窗口、每小时扣费、最近请求、定时测试、可用模型）。全部挂在 .lay-main 下；文末是外观变体 vis-soft / vis-mid 的对应覆盖。 */

.lay-main .vd { position: absolute; inset: 0; }

/* status card extras */
.lay-main .vd-hero-note { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--ink2); }
.lay-main .vd-quiet { min-height: 60px; }
.lay-main .vd-quiet-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* in-card primary action ("menu" mode) */
.lay-main .vd-cta { position: relative; margin-top: 16px; width: 100%; height: 48px; border-radius: var(--btn-radius, 10px); background: var(--accent-fill); color: var(--on-accent); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 16px; font-weight: 600; white-space: nowrap; }
.lay-main .vd-cta:hover { filter: brightness(1.06); }
.lay-main .vd-cta:active { filter: brightness(.94); }
.lay-main .vd-cta-s { margin: 0 0 0 auto; width: auto; height: 38px; padding: 0 14px; font-size: 14.5px; flex: none; }
.lay-main .vd-cta-s::after { content: ''; position: absolute; inset: -4px -2px; }
.lay-main .vd-cta.is-plain { background: var(--btn-bg); color: var(--btn-ink); border: 1px solid var(--hairline); }
.lay-main .vd-cta.is-plain svg { color: var(--accent); }

/* nav ⋯ button + pull-down menu */
.lay-main .vd-more.on { background: var(--accent-wash); color: var(--accent); border-color: transparent; }
.lay-main .vd-menu-layer { z-index: 45; }
.lay-main .vd-menu { position: absolute; top: 104px; right: 12px; width: 252px; border-radius: 24px; padding: 6px; transform-origin: top right; animation: vd-pop .2s cubic-bezier(.2, .9, .3, 1.1);
  background: color-mix(in srgb, var(--surface) 90%, transparent); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); box-shadow: 0 14px 44px rgba(15, 25, 30, .22), 0 0 0 1px var(--hairline); border: 0; }
.lay-main.dark .vd-menu { background: color-mix(in srgb, var(--sunken) 92%, transparent); box-shadow: 0 16px 48px rgba(0, 0, 0, .6), 0 0 0 1px var(--hairline); }
@keyframes vd-pop { from { opacity: 0; transform: scale(.9); } }
.lay-main .vd-mi { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 16px; font-size: 16px; color: var(--ink1); text-align: left; }
.lay-main .vd-mi svg { color: var(--ink1); }
.lay-main .vd-mi:hover { background: var(--hover); }
.lay-main .vd-mi-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lay-main .vd-mi-label small { font-size: 12.5px; color: var(--ink2); }
.lay-main .vd-menu-sep { height: 1px; margin: 5px 14px; background: var(--hairline); }

/* bottom glass toolbar ("toolbar" mode): the tab bar steps aside on this screen. No dividers inside the group —
   iOS 26 bottomBar groups draw none either. */
.lay-main:has(.vd-hide-tabs) > .tabbar { display: none; }
.lay-main .vd-edge { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; z-index: 21; pointer-events: none; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--canvas) 88%, transparent) 70%); }
.lay-main .vd-toolbar { position: absolute; left: 16px; right: 16px; bottom: 26px; z-index: 22; display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
.lay-main .vd-tb-group { pointer-events: auto; height: 56px; border-radius: 28px; display: flex; align-items: center; padding: 0 5px; gap: 0; }
.lay-main .vd-tb-btn { height: 46px; padding: 0 13px; border-radius: 23px; display: inline-flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 600; color: var(--ink1); white-space: nowrap; }
.lay-main .vd-tb-btn:hover { background: var(--hover); }
.lay-main .vd-tb-prim { pointer-events: auto; height: 56px; padding: 0 22px; border-radius: 28px; background: var(--accent-fill); color: var(--on-accent); display: inline-flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 20px rgba(11, 110, 133, .28), inset 0 1px 0 rgba(255, 255, 255, .22); }
.lay-main .vd-tb-prim:hover { filter: brightness(1.06); }
.lay-main.dark .vd-tb-prim { box-shadow: 0 8px 24px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .14); }

/* segmented groups ("seg" mode): the control pins under the nav; every tab keeps at least a screen of room
   (100% = the scroll box minus its tab-bar padding) so switching while pinned does not jump. */
.lay-main .vd-seg-anchor { height: 0; }
.lay-main .vd-info-seg .detail-head { padding-bottom: 10px; }
.lay-main .vd-segbar { position: sticky; top: 0; z-index: 3; padding: 6px 16px 12px; margin: 0 0 4px; background: var(--canvas); transition: box-shadow .2s; }
.lay-main .vd-segbar.is-pinned { box-shadow: 0 1px 0 var(--hairline); }
.lay-main .vd-segbar .seg-item { font-size: 14.5px; }
.lay-main .vd-panel { min-height: calc(100% - 50px); animation: vd-fade .18s ease-out; }
@keyframes vd-fade { from { opacity: 0; transform: translateY(4px); } }

/* collapsible groups ("fold" mode) */
.lay-main .vd-folds { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.lay-main .vd-fold { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--panel-radius); overflow: hidden; }
.lay-main .vd-fold-head { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 9px 14px; text-align: left; }
.lay-main .vd-fold-head:hover { background: var(--hover-row); }
.lay-main .vd-fold-ico { width: 34px; height: 34px; border-radius: 9px; background: var(--sunken); color: var(--ink2); display: flex; align-items: center; justify-content: center; flex: none; }
.lay-main .vd-fold.open .vd-fold-ico { background: var(--accent-wash); color: var(--accent); }
.lay-main .vd-fold-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lay-main .vd-fold-title { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main .vd-fold-sum { font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: inherit; }
.lay-main .vd-fold-chev { color: var(--ink3); display: flex; transition: transform .2s ease; }
.lay-main .vd-fold.open .vd-fold-chev { transform: rotate(90deg); }
.lay-main .vd-fold-body { border-top: 1px solid var(--hairline); animation: vd-fade .18s ease-out; }
.lay-main .vd-fold-block + .vd-fold-block { border-top: 1px solid var(--hairline); }
.lay-main .vd-sub { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 0; }
.lay-main .vd-sub b { font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.lay-main .vd-sub span { margin-left: auto; font-size: 12.5px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* shared blocks */
.lay-main .vd-bars-wrap { padding: 12px 16px 8px; }
.lay-main .vd-bars { display: block; }
.lay-main .vd-bars .chart-axis { font-size: 12px; }
.lay-main .vd-reset { min-width: 60px; text-align: right; font-size: 12px; }
.lay-main .vd-empty { display: flex; flex-direction: column; gap: 2px; }
.lay-main .vd-empty small { font-size: 12.5px; color: var(--ink3); }
.lay-main .vd-test { display: flex; align-items: center; gap: 10px; min-height: 46px; font-size: 14.5px; }
.lay-main .vd-test + .vd-test { border-top: 1px solid var(--hairline-soft, var(--hairline)); }
.lay-main .vd-test-ico { color: var(--tone-ink); display: flex; }
.lay-main .vd-test-t { width: 42px; flex: none; font-size: 13.5px; font-weight: 600; color: var(--ink1); }
.lay-main .vd-test-msg { flex: 1; min-width: 0; color: var(--ink1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vd-test-msg.mono { font-size: 13px; }
.lay-main .vd-test-ms { flex: none; font-size: 13.5px; color: var(--ink2); }
.lay-main .vd-models { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; padding-bottom: 12px; }
.lay-main .vd-model { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--sunken); font-size: 13.5px; color: var(--ink1); }
.lay-main .vd-model.is-limited { background: var(--model-wash); color: var(--model-ink); }
.lay-main .vd-model small { font-size: 12px; }

/* ---------- appearance variants (v-vis): give the new parts the same radii / lift as the rest of the app ---------- */

.lay-main.vis-soft .vd-cta { border-radius: 24px; box-shadow: var(--vs-primary, 0 6px 16px rgba(11, 110, 133, .24)); }
.lay-main.vis-soft.dark .vd-cta { box-shadow: none; }
.lay-main.vis-soft .vd-cta.is-plain { border: 0; background: var(--sunken); box-shadow: none; }
.lay-main.vis-soft .vd-menu { border-radius: 26px; }
.lay-main.vis-soft .vd-mi { border-radius: 18px; }
.lay-main.vis-soft .vd-segbar { padding-top: 8px; }
.lay-main.vis-soft .vd-folds { gap: 14px; }
.lay-main.vis-soft .vd-fold { border: 0; border-radius: 22px; box-shadow: var(--vs-card, 0 1px 2px rgba(20, 24, 27, .05), 0 8px 22px rgba(20, 24, 27, .06)); }
.lay-main.vis-soft.dark .vd-fold { box-shadow: var(--vs-card, inset 0 0 0 1px rgba(255, 255, 255, .065)); }
.lay-main.vis-soft .vd-fold-head { min-height: 64px; padding: 10px 16px; }
.lay-main.vis-soft .vd-fold-ico { border-radius: 10px; }
.lay-main.vis-soft .vd-fold-body,
.lay-main.vis-soft .vd-fold-block + .vd-fold-block { border-top-style: dashed; }
.lay-main.vis-soft .vd-model { border-radius: 14px; padding: 6px 12px; }

.lay-main.vis-mid .vd-cta { border-radius: 14px; }
.lay-main.vis-mid .vd-cta.is-plain { border: 0; background: var(--sunken); }
.lay-main.vis-mid .vd-menu { border-radius: 20px; }
.lay-main.vis-mid .vd-mi { border-radius: 14px; }
.lay-main.vis-mid .vd-fold { border: 0; border-radius: 18px; box-shadow: var(--vm-lift, 0 1px 2px rgba(20, 24, 27, .05), 0 1px 1px rgba(20, 24, 27, .03)); }
.lay-main.vis-mid.dark .vd-fold { box-shadow: none; }
.lay-main.vis-mid .vd-fold-body,
.lay-main.vis-mid .vd-fold-block + .vd-fold-block { border-top-color: color-mix(in srgb, var(--hairline) 70%, transparent); }
.lay-main.vis-mid .vd-model { border-radius: 11px; }

/* v-request：请求详情的收据式（.rqr-*）与时间线式（.rqt-*）。所有选择器挂在 .lay-main 下，只用 Vernier 变量。 */

/* ---------- 收据式 ---------- */

/* Paper = a stub and a body that meet at a perforation with round notches; the body ends in a scalloped tear.
   The outline follows the masked shape via drop-shadow on the wrapper (SwiftUI: a custom Shape + stroke). */
.lay-main .rqr-wrap {
  margin: 6px 16px 26px;
  filter: drop-shadow(0 0 .6px var(--rule-strong)) drop-shadow(0 6px 14px rgba(20, 24, 27, .07));
}
.lay-main.dark .rqr-wrap { filter: drop-shadow(0 0 .7px var(--rule-strong)) drop-shadow(0 8px 18px rgba(0, 0, 0, .45)); }

.lay-main .rqr-stub {
  position: relative; background: var(--surface); border-radius: 18px 18px 0 0; padding: 22px 18px 22px; text-align: center;
  -webkit-mask:
    radial-gradient(circle 11px at 0 100%, #0000 10.5px, #000 11px) left top / 51% 100% no-repeat,
    radial-gradient(circle 11px at 100% 100%, #0000 10.5px, #000 11px) right top / 51% 100% no-repeat;
          mask:
    radial-gradient(circle 11px at 0 100%, #0000 10.5px, #000 11px) left top / 51% 100% no-repeat,
    radial-gradient(circle 11px at 100% 100%, #0000 10.5px, #000 11px) right top / 51% 100% no-repeat;
}
.lay-main .rqr-body {
  position: relative; background: var(--surface); padding: 8px 18px 24px;
  -webkit-mask:
    radial-gradient(circle 11px at 0 0, #0000 10.5px, #000 11px) left top / 51% calc(100% - 5px) no-repeat,
    radial-gradient(circle 11px at 100% 0, #0000 10.5px, #000 11px) right top / 51% calc(100% - 5px) no-repeat,
    radial-gradient(circle 5px at 50% 100%, #0000 4.6px, #000 5px) left bottom / 14px 8px round no-repeat;
          mask:
    radial-gradient(circle 11px at 0 0, #0000 10.5px, #000 11px) left top / 51% calc(100% - 5px) no-repeat,
    radial-gradient(circle 11px at 100% 0, #0000 10.5px, #000 11px) right top / 51% calc(100% - 5px) no-repeat,
    radial-gradient(circle 5px at 50% 100%, #0000 4.6px, #000 5px) left bottom / 14px 8px round no-repeat;
}
.lay-main .rqr-body::before {
  content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 2px;
  background: linear-gradient(to right, var(--rule-strong) 0 6px, transparent 6px) 0 0 / 11px 1.5px repeat-x; opacity: .55;
}

/* stub */
.lay-main .rqr-merchant { font-size: 14px; color: var(--ink2); word-break: break-all; line-height: 1.35; }
.lay-main .rqr-big {
  font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%;
  font-size: 62px; font-weight: 500; line-height: 1.04; letter-spacing: -.015em; margin-top: 6px; color: var(--ink1);
}
.lay-main .rqr-big.tone-text { color: var(--tone-ink); }
.lay-main .rqr-big-label { font-size: 13px; color: var(--ink2); margin-top: 12px; letter-spacing: .04em; }
.lay-main .rqr-big-label + .rqr-big { margin-top: 0; }
.lay-main .rqr-status { display: inline-flex; align-items: center; gap: 5px; font-size: 14.5px; font-weight: 600; margin-top: 6px; }
.lay-main .rqr-saved {
  display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px auto 0; width: fit-content; max-width: 100%;
  padding: 6px 11px; border-radius: 8px; background: var(--tone-wash); color: var(--tone-ink); font-size: 14px; font-weight: 600;
}
.lay-main .rqr-error {
  margin-top: 14px; text-align: left; background: var(--sunken); border-radius: 10px; padding: 10px 12px;
  font-size: 13px; line-height: 1.5; color: var(--ink1); word-break: break-word;
}
.lay-main .rqr-stub .actions { margin-top: 14px; }

/* "已处理" stamp: a rotated ink frame beside the big status code */
.lay-main .rqr-stamp {
  position: absolute; top: 52px; right: 20px; transform: rotate(-12deg); pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 9px 3px;
  border: 2px solid var(--ok-ink); border-radius: 7px; color: var(--ok-ink); line-height: 1.1;
  box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 2.5px var(--ok-ink);
  animation: rqr-stamp .26s cubic-bezier(.2, .9, .3, 1.3);
}
.lay-main .rqr-stamp b { font-size: 15px; font-weight: 700; letter-spacing: .14em; margin-right: -.14em; }
.lay-main .rqr-stamp span { font-size: 12px; font-weight: 600; }
.lay-main .rqr-stamp small { font-size: 12px; font-weight: 600; font-family: var(--mono-font); opacity: .85; }
@keyframes rqr-stamp { from { opacity: 0; transform: rotate(-12deg) scale(1.5); } }
@media (prefers-reduced-motion: reduce) { .lay-main .rqr-stamp { animation: none; } }

/* body lines */
.lay-main .rqr-group { padding: 4px 0; }
.lay-main .rqr-group + .rqr-group { background: linear-gradient(to right, var(--hairline) 0 4px, transparent 4px) 0 0 / 7px 1px repeat-x; }
.lay-main .rqr-line { position: relative; display: flex; align-items: flex-start; gap: 12px; min-height: 40px; padding: 10px 0; }
.lay-main .rqr-line.tappable { cursor: pointer; min-height: 44px; margin: 0 -18px; padding-left: 18px; padding-right: 14px; }
.lay-main .rqr-line.tappable:hover { background: var(--hover-row); }
.lay-main .rqr-label { flex: none; font-size: 14px; color: var(--ink2); padding-top: 1px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lay-main .rqr-label small { font-size: inherit; color: inherit; }
.lay-main .rqr-value {
  flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 8px;
  text-align: right; font-size: 15px; color: var(--ink1);
}
.lay-main .rqr-value .mono { font-size: 14px; word-break: break-all; }
.lay-main .rqr-chev { flex: none; color: var(--ink3); opacity: .7; padding-top: 3px; }
.lay-main .rqr-tag { font-style: normal; font-size: 12px; font-weight: 600; color: var(--ink2); padding: 0 5px; border: 1px solid var(--hairline); border-radius: 4px; line-height: 18px; }
.lay-main .rqr-acct { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lay-main .rqr-code { font-family: var(--mono-font); font-size: 12.5px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: var(--tone-wash); color: var(--tone-ink); }
.lay-main .rqr-dur { color: var(--ink2); font-size: 14px; min-width: 38px; }
.lay-main .rqr-soft { color: var(--ink2); font-size: 14px; }
.lay-main .rqr-rid { font-size: 13px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lay-main .rqr-copy { font-size: 14px; font-weight: 600; color: var(--accent); padding-left: 4px; }


/* ---------- 时间线式 ---------- */

.lay-main .rqt-head { padding: 2px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.lay-main .rqt-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink3); }
.lay-main .rqt-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 4px;
  background: var(--tone-wash); color: var(--tone-ink); font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.lay-main .rqt-cause { font-size: 14px; color: var(--ink2); margin-left: 2px; }
.lay-main .rqt-model { font-size: 20px; font-weight: 600; line-height: 1.25; word-break: break-all; margin-top: -2px; }
.lay-main .rqt-stats { display: grid; grid-template-columns: 1fr 1fr 1.25fr; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: 10px 0 9px; }
.lay-main .rqt-stats > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lay-main .rqt-stats > div + div { border-left: 1px solid var(--hairline); padding-left: 12px; }
.lay-main .rqt-stats small { font-size: 12.5px; color: var(--ink2); }
.lay-main .rqt-stats b {
  font-family: "SF Pro Display", "Bahnschrift", -apple-system, sans-serif; font-stretch: 75%;
  font-size: 27px; font-weight: 500; line-height: 1.1; color: var(--ink1); white-space: nowrap;
}
.lay-main .rqt-stats b.tone-text { color: var(--tone-ink); }
.lay-main .rqt-stats b.is-word { font-family: inherit; font-stretch: normal; font-size: 19px; font-weight: 600; line-height: 30px; }
.lay-main .rqt-stats b small { font-family: -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; font-stretch: normal; font-size: 14px; color: var(--ink2); }
.lay-main .rqt-error { background: var(--sunken); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink1); word-break: break-word; }

/* rail */
.lay-main .rqt-rail { list-style: none; margin: 0; padding: 6px 0; }
.lay-main .rqt-node { position: relative; display: flex; gap: 0; padding: 10px 14px 10px 0; min-height: 44px; }
.lay-main .rqt-node.tappable { cursor: pointer; }
.lay-main .rqt-node.tappable:hover { background: var(--hover-row); }
.lay-main .rqt-pin { flex: none; width: 40px; position: relative; }
.lay-main .rqt-pin i {
  position: absolute; left: 15px; top: 6px; width: 10px; height: 10px; border-radius: 5px; z-index: 1;
  background: var(--tone); box-shadow: 0 0 0 3px var(--tone-wash);
}
.lay-main .rqt-node.is-hollow .rqt-pin i { background: var(--surface); border: 2px solid var(--ink3); box-shadow: none; }
.lay-main .rqt-node.is-strong .rqt-pin i { left: 14px; top: 5px; width: 12px; height: 12px; border-radius: 6px; }
/* connectors: ::before = from the previous node down to this dot, ::after = from this dot to the next node */
.lay-main .rqt-node::before, .lay-main .rqt-node::after { content: ''; position: absolute; left: 19px; width: 2px; background: var(--hairline); }
.lay-main .rqt-node::before { top: 0; height: 21px; }
.lay-main .rqt-node::after { top: 21px; bottom: 0; }
.lay-main .rqt-node:first-child::before, .lay-main .rqt-node:last-child::after { display: none; }
.lay-main .rqt-node.is-dashed::after { background: repeating-linear-gradient(to bottom, var(--tone) 0 4px, transparent 4px 8px); }
.lay-main .rqt-node.is-dashed + .rqt-node::before { background: repeating-linear-gradient(to bottom, var(--hairline) 0 4px, transparent 4px 8px); }

.lay-main .rqt-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .rqt-top { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.lay-main .rqt-title { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .rqt-node.is-strong .rqt-title { font-weight: 600; }
.lay-main .rqt-tag { flex: none; font-style: normal; font-size: 12px; font-weight: 600; color: var(--ink2); padding: 0 5px; border: 1px solid var(--hairline); border-radius: 4px; line-height: 18px; }
.lay-main .rqt-right { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink2); white-space: nowrap; }
.lay-main .rqt-node.is-strong .rqt-right { font-size: 15px; font-weight: 600; color: var(--ink1); }
.lay-main .rqt-code { font-family: var(--mono-font); font-size: 12.5px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: var(--tone-wash); color: var(--tone-ink); }
.lay-main .rqt-chev { flex: none; color: var(--ink3); opacity: .7; margin-right: -4px; display: flex; }
.lay-main .rqt-meta { font-size: 14px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .rqt-meta .mono { font-size: 12.5px; }

/* waterfall: where this attempt sits inside the whole request; the tick marks the first token */
.lay-main .rqt-bar { position: relative; height: 4px; margin: 7px 4px 2px 0; border-radius: 2px; background: var(--track); }
.lay-main .rqt-bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: var(--tone); }
.lay-main .rqt-bar b { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: var(--ink1); }

/* completion receipt inside the last node */
.lay-main .rqt-receipt { margin-top: 8px; border-radius: 10px; background: var(--sunken); padding: 2px 12px; }
.lay-main .rqt-cells { display: grid; gap: 6px; padding: 9px 0; }
.lay-main .rqt-cells + .rqt-cells { border-top: 1px solid var(--hairline); }
.lay-main .rqt-cells-4 { grid-template-columns: repeat(4, 1fr); }
.lay-main .rqt-cells-2 { grid-template-columns: repeat(2, 1fr); }
.lay-main .rqt-cells span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lay-main .rqt-cells small { font-size: 12px; color: var(--ink2); white-space: nowrap; }
.lay-main .rqt-cells b { font-size: 14.5px; font-weight: 600; color: var(--ink1); white-space: nowrap; }

/* numbered pins for upstream attempts */
.lay-main .rqt-node.is-step .rqt-pin i {
  left: 10px; top: 1px; width: 20px; height: 20px; border-radius: 10px; box-shadow: none;
  background: var(--tone-wash); color: var(--tone-ink); border: 1.5px solid var(--tone);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-style: normal;
}
.lay-main.dark .rqt-bar { background: var(--hairline); }
.lay-main .rqt-copy { flex: none; font-size: 14px; font-weight: 600; color: var(--accent); margin-left: 8px; }

/* 首页（今日）变体：营收区位置、待处理粒度、平静态，以及首页下钻的分组账号与告警详情。所有选择器挂在 .lay-main 下，类名前缀 vt-。 */

/* big condensed figures (same family as the instrument readouts). SwiftUI: .minimumScaleFactor(0.5).lineLimit(1) */
.lay-main .vt-figure { font-family: "SF Pro Display", "Bahnschrift", sans-serif; font-stretch: 75%; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05; color: var(--ink1); white-space: nowrap; }

/* calm mode is a home-screen what-if: hide the live error badge on the 账号 tab while it is shown */
.lay-main:has(.vt-calm-flag) .tab-badge { display: none; }

/* small inline buttons keep a 30px look but get a 44px hit area (SwiftUI: .frame(minHeight: 44) + .contentShape) */
.lay-main .vt-hit .act-small { position: relative; }
.lay-main .vt-hit .act-small::after { content: ''; position: absolute; left: -5px; right: -5px; top: -8px; bottom: -8px; } /* 28px padding box + 16 = 44 */

/* ---------- chart ---------- */
.lay-main .vt-plot { position: relative; }
.lay-main .vt-chart { display: block; overflow: visible; }
.lay-main .vt-chart-base { stroke: var(--rule-strong); stroke-width: 1; }
.lay-main .vt-chart-line { fill: none; stroke: var(--chart-main); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.lay-main .vt-chart-area { fill: var(--ink1); opacity: .07; }
.lay-main .vt-chart-yest { fill: none; stroke: var(--chart-compare); stroke-width: 1.3; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.lay-main .vt-chart-now { fill: var(--chart-main); stroke: var(--canvas); stroke-width: 2; }
.lay-main .sec .vt-chart-now { stroke: var(--surface); }
.lay-main .vt-chart-bar { fill: var(--chart-bar); }
.lay-main .vt-chart-bar.is-now { fill: var(--chart-bar-now); }
.lay-main .vt-plot-legend { position: absolute; left: 0; top: -4px; }
.lay-main .vt-plot-end { position: absolute; right: 0; margin-top: 5px; font-size: 12px; line-height: 14px; color: var(--ink2); white-space: nowrap; }
.lay-main .vt-axis { position: relative; height: 16px; margin-top: 5px; font-size: 12px; color: var(--ink3); }
.lay-main .vt-axis span { position: absolute; top: 0; white-space: nowrap; line-height: 16px; }
.lay-main .vt-axis .vt-axis-now { transform: translateX(-50%); color: var(--ink1); font-weight: 600; }
.lay-main .vt-legend { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink2); white-space: nowrap; }

/* 第 2 轮 · 用户变体（v-users）：钱包卡、紧凑头部 + 流水在前、右侧固定列（状态用三种形状）、快捷充值头像。所有选择器挂在 .lay-main 下。 */

.lay-main .vu-hero-flag { display: inline-flex; align-self: center; margin-left: 6px; }

/* ---------- 用户详情 · 共用分区 ---------- */

.lay-main .vu-banner .act-small { position: relative; }

.lay-main .vu-more:hover { background: var(--hover-row); }

/* ---------- 钱包卡（B 式）：浅色用石墨底白字，深色用抬升一级的面板 ---------- */
.lay-main .vu-wallet {
  --vw-bg: var(--ink1); --vw-ink: var(--surface); --vw-dim: rgba(255, 255, 255, .72); --vw-rule: rgba(255, 255, 255, .16);
  --vw-btn: rgba(255, 255, 255, .14); --vw-btn-ink: var(--surface); --vw-pri: var(--surface); --vw-pri-ink: var(--ink1);
  position: relative; overflow: hidden; margin: 2px 16px 16px; padding: 22px 18px 16px; border-radius: 24px; color: var(--vw-ink);
  background: radial-gradient(130% 100% at 100% 0%, rgba(255, 255, 255, .10), transparent 58%), var(--vw-bg);
  box-shadow: 0 14px 30px rgba(20, 24, 27, .20), 0 2px 6px rgba(20, 24, 27, .10);
}
.lay-main.dark .vu-wallet {
  --vw-bg: var(--sunken); --vw-ink: var(--ink1); --vw-dim: var(--ink2); --vw-rule: rgba(255, 255, 255, .10);
  --vw-btn: rgba(255, 255, 255, .08); --vw-btn-ink: var(--ink1); --vw-pri: var(--ink1); --vw-pri-ink: var(--canvas);

}
.lay-main .vu-wallet.is-disabled .vu-bal { opacity: .6; }

.lay-main .vu-wallet-id small { font-size: 13px; color: var(--vw-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-wallet-tag { flex: none; height: 24px; padding: 0 9px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; background: var(--vw-btn); color: var(--vw-dim); }

.lay-main .vu-wallet-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--vw-rule); }

.lay-main .vu-wallet-actions { display: flex; gap: 10px; margin-top: 16px; }

.lay-main .vu-head-bal small { font-size: 12.5px; color: var(--ink2); }
.lay-main .vu-head-acts { flex: none; display: flex; gap: 8px; margin-left: auto; }
.lay-main .vu-btn { height: 44px; padding: 0 13px; border-radius: 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 600; background: var(--btn-bg); color: var(--btn-ink); border: 1px solid var(--hairline); white-space: nowrap; }
.lay-main .vu-btn.primary { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
.lay-main .vu-btn:active { opacity: .82; }
.lay-main .vu-head-sub { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-top: 12px; padding: 9px 0 10px; border-top: 1px solid var(--hairline); font-size: 13.5px; color: var(--ink2); }
.lay-main .vu-head-sub b { color: var(--ink1); font-weight: 600; margin-left: 2px; }
.lay-main .vu-head-sub .badge { margin-left: auto; }
.lay-main .vu-lg-row { align-items: center; padding-top: 10px; padding-bottom: 10px; }
.lay-main .vu-lg-row .row-lead { width: 26px; padding-top: 0; }
.lay-main .vu-lg-icon { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: var(--sunken); color: var(--ink2); }
.lay-main .vu-lg-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .vu-lg-kind { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-lg-note { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-lg-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.lay-main .vu-lg-side b { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main .vu-lg-side > span { font-size: 13px; color: var(--ink2); white-space: nowrap; }

/* ---------- 列表 · 右侧固定列 ---------- */
.lay-main .vu-urow { align-items: center; padding-top: 10px; padding-bottom: 10px; }
.lay-main .vu-urow .row-lead { padding-top: 0; }
.lay-main .vu-urow .row-chev { padding-top: 0; }
.lay-main .vu-urow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lay-main .vu-urow-mail { font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-urow-side { flex: none; min-width: 92px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.lay-main .vu-urow-bal { display: inline-flex; align-items: center; gap: 7px; }
.lay-main .vu-urow-bal b { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main .vu-urow.is-idle .vu-urow-bal b { color: var(--ink2); }
.lay-main .vu-urow-today { font-size: 13px; color: var(--ink2); white-space: nowrap; }
.lay-main .vu-dot { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--tone); }
.lay-main .vu-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; color: var(--tone); }
.lay-main .vu-cols-head { align-items: center; }
.lay-main .vu-legend { display: inline-flex; align-items: center; gap: 12px; font-weight: 500; }
.lay-main .vu-legend > span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- 列表 · 快捷充值头像 ---------- */
.lay-main .vu-quick { padding: 2px 0 14px; }
.lay-main .vu-quick-head { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 18px 6px; }
.lay-main .vu-quick-head span { font-size: 13px; font-weight: 600; color: var(--ink2); }
.lay-main .vu-quick-head small { font-size: 12.5px; color: var(--ink3); }
.lay-main .vu-quick-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 10px; }
.lay-main .vu-q { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 14px; }
.lay-main .vu-q:hover { background: var(--hover-row); }
.lay-main .vu-q:active { background: var(--hover); }
.lay-main .vu-q-avatar { position: relative; width: 52px; height: 52px; border-radius: 26px; display: inline-flex; align-items: center; justify-content: center; background: var(--sunken); font-size: 20px; font-weight: 600; color: var(--ink1); margin-bottom: 2px; }
.lay-main .vu-q.is-flag .vu-q-avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--tone); }
.lay-main .vu-q-badge { position: absolute; right: -3px; bottom: -3px; width: 21px; height: 21px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; background: var(--accent-fill); color: var(--on-accent); box-shadow: 0 0 0 2.5px var(--surface); }
.lay-main .vu-q.is-pending .vu-q-badge { background: var(--caution); color: var(--surface); }
.lay-main .vu-q-name { max-width: 100%; font-size: 13px; font-weight: 600; color: var(--ink1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lay-main .vu-q-sub { font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.lay-main .vu-q.is-flag .vu-q-sub { color: var(--tone-ink); }
.lay-main .vu-ledger-val { font-size: 16px; font-weight: 600; color: var(--ink1); white-space: nowrap; }

/* 外观变体（vis）。只改外观、不动布局；颜色只用 Vernier 变量（阴影只调透明度）。
   vis-soft「B 式柔和」：滚动页（概览、详情、监控）是 22px 大圆角卡片 + 柔和阴影（深色改细描边）；列表页（账号、用户、使用记录）
     是 List(.insetGrouped) 式内嵌分组，不加阴影（SwiftUI 的 List 分组投不出阴影）。圆体数字（真机 SF Pro Rounded，网页预览退回系统字体）、
     更宽松的留白、圆点 + 胶囊状态牌（状态卡里只留圆点 + 文字）、图标底块、状态卡渐变底；小按钮次要 = 青色浅底、主要 = 实心青。
   vis-mid 「折中」：18px 圆角、无描边、极淡阴影（深色无）、浮动的圆头状态竖条、胶囊 + 图标状态牌、标准宽度 SF Pro 中等字重数字、细线保留但更淡。 */

/* =====================================================================
   vis-soft · B 式柔和
   ===================================================================== */

.lay-main.vis-soft {
  /* SF Pro Rounded on Apple (same stack as B); browsers without it fall back to the system UI face, as B's preview does */
  --num-font: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --readout-font: var(--num-font);
  --money-font: var(--num-font);
  --money-xl-font: 600 46px/1.05 var(--num-font);
  --amount-font: 600 56px/1.1 var(--num-font);
  --panel-radius: 22px;
  --badge-radius: 12px;
  --chip-radius: 18px;
  --btn-radius: 24px;
  --cap-radius: 4px;
  --cap-h: 8px;
  --row-title-weight: 600;
  --readout-weight: 600;
  --money-weight: 600;
  --vs-card: 0 1px 2px rgba(20, 24, 27, .05), 0 8px 22px rgba(20, 24, 27, .06);
  --vs-chip: 0 1px 2px rgba(20, 24, 27, .06), 0 2px 6px rgba(20, 24, 27, .04);
  --vs-primary: 0 6px 16px rgba(11, 110, 133, .24);
}
.lay-main.vis-soft.dark {
  --vs-card: inset 0 0 0 1px rgba(255, 255, 255, .065);
  --vs-chip: inset 0 0 0 1px rgba(255, 255, 255, .07);
  --vs-primary: none;
}

/* numerals: rounded, normal width (undo the instrument's condensed readouts) */
.lay-main.vis-soft .readout,
.lay-main.vis-soft .money-xl,
.lay-main.vis-soft .money-l,
.lay-main.vis-soft .strip-side b,
.lay-main.vis-soft .kp-amount,
.lay-main.vis-soft .rq-cost b { font-family: var(--num-font); font-stretch: 100%; font-weight: 600; letter-spacing: -.01em; }
.lay-main.vis-soft .money-l { font-size: 21px; }
.lay-main.vis-soft .strip-side b { font-size: 20px; }
.lay-main.vis-soft .hero .readout-xl { font-size: 54px; letter-spacing: -.02em; }
.lay-main.vis-soft .kp-amount { font-size: 66px; letter-spacing: -.025em; }

/* rhythm: looser between cards, a little more air inside them */
.lay-main.vis-soft .strip { margin: 6px 16px 26px; }
.lay-main.vis-soft .sec-wrap { margin: 0 16px 28px; }
.lay-main.vis-soft .detail-head { padding: 6px 16px 28px; gap: 16px; }
.lay-main.vis-soft .row { padding: 12px 16px; gap: 12px; }
.lay-main.vis-soft .lg-row { padding-top: 10px; padding-bottom: 10px; }
.lay-main.vis-soft .cap-line { padding-top: 12px; padding-bottom: 12px; }
.lay-main.vis-soft .ledger-line { padding-top: 12px; padding-bottom: 12px; }
.lay-main.vis-soft .balance-hero { padding: 2px 16px 28px; }

/* section heads: big bold title, no rule */
.lay-main.vis-soft .sec-head { padding: 0 4px 10px; align-items: baseline; }
.lay-main.vis-soft .sec-title { font-size: 19px; font-weight: 700; color: var(--ink1); letter-spacing: -.01em; }
.lay-main.vis-soft .sec-line { background: none; }
.lay-main.vis-soft .sec-meta { font-size: 13.5px; font-weight: 500; color: var(--ink3); }

/* cards on scroll pages (overview, details, monitor): no border, soft lift (dark: thin ring instead of shadow) */
.lay-main.vis-soft .sec,
.lay-main.vis-soft .chan-stat { border: 0; box-shadow: var(--vs-card); }
.lay-main.vis-soft .sec { border-radius: 22px; }

/* every List page (accounts, users, request log) is SwiftUI List(.insetGrouped): rounded groups, the group head inside
   like B's card heads, and NO shadow — a List section cannot cast one, so the preview doesn't pretend it can.
   Rows trim their side padding so the inset costs as little text as possible. */
.lay-main.vis-soft .screen-plain { background: var(--canvas); }
.lay-main.vis-soft .list-group { margin: 0 16px 20px; border-radius: 22px; overflow: hidden; background: var(--surface); box-shadow: none; }
.lay-main.vis-soft .list-head { background: transparent; padding: 15px 14px 4px; font-size: 15px; font-weight: 700; color: var(--ink1); letter-spacing: 0; }
.lay-main.vis-soft .list-head b { font-size: 13.5px; font-weight: 600; color: var(--ink3); }
.lay-main.vis-soft .list-group .row { padding-left: 14px; padding-right: 14px; gap: 10px; }
.lay-main.vis-soft .list-group .row + .row::before { left: 52px; }

/* the request log joins the same inset groups; its rows run tighter so the pinned right column keeps its width */
.lay-main.vis-soft .list-head b.lg-head-cols { font-size: 12px; font-weight: 500; }
.lay-main.vis-soft .list-group .lg-row { padding: 10px 10px 10px 14px; gap: 8px; }
.lay-main.vis-soft .list-group .lg-row + .lg-row::before { left: 14px; }
.lay-main.vis-soft .lg-row .row-chev { padding-top: 0; }

/* status: rails give way to tinted icon tiles; the hero gets B's pass-card wash */
.lay-main.vis-soft .rail { background: none; }
.lay-main.vis-soft .rail.tappable:hover { background: var(--hover-row); }
.lay-main.vis-soft .row-lead { width: 28px; padding-top: 0; align-self: flex-start; }
.lay-main.vis-soft .glyph,
.lay-main.vis-soft .lead-icon { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--tone-wash, var(--sunken)); color: var(--tone-ink, var(--ink2)); }
.lay-main.vis-soft .glyph svg, .lay-main.vis-soft .lead-icon svg { width: 16px; height: 16px; }
.lay-main.vis-soft .glyph-normal { background: var(--sunken); color: var(--ok); }
.lay-main.vis-soft .glyph-normal svg { width: 15px; height: 15px; } /* the 'dot' icon → a ~6px dot, same as the badge dots */
.lay-main.vis-soft .lead-icon.dim { background: var(--sunken); color: var(--ink2); }
.lay-main.vis-soft .row-lead .select-ring { margin-top: 3px; }
.lay-main.vis-soft .row-chev { padding-top: 7px; }
.lay-main.vis-soft .row-main { min-height: 28px; justify-content: center; } /* one-line rows centre on the tile */
.lay-main.vis-soft .row + .row::before { left: 56px; }
/* light sheets sit on the grey canvas: lift neutral tiles to white so they stay visible */
.lay-main.vis-soft.light .sheet .glyph-normal,
.lay-main.vis-soft.light .sheet .glyph.tone-neutral,
.lay-main.vis-soft.light .sheet .avatar { background: var(--surface); }

/* lamp plates → dot + capsule */
.lay-main.vis-soft .badge { height: 24px; padding: 0 10px 0 9px; gap: 6px; border-radius: 12px; font-size: 12.5px; font-weight: 600; }
.lay-main.vis-soft .badge > svg { display: none !important; } /* Icon sets display:block inline */
.lay-main.vis-soft .badge::before { content: ''; width: 6px; height: 6px; border-radius: 3px; background: var(--tone); flex: none; }
.lay-main.vis-soft .badge-big { height: 30px; padding: 0 13px 0 11px; gap: 7px; border-radius: 15px; font-size: 14px; }
.lay-main.vis-soft .badge-big::before { width: 7px; height: 7px; border-radius: 4px; }

/* hero (status card) */
.lay-main.vis-soft .hero,
.lay-main.vis-soft .hero.rail,
.lay-main.vis-soft .hero-quiet { border: 0; border-radius: 24px; background: linear-gradient(160deg, var(--tone-wash, var(--surface)), var(--surface) 64%); box-shadow: var(--vs-card); padding: 18px; }
.lay-main.vis-soft .hero-quiet { padding: 16px 18px; gap: 12px; font-size: 16px; }
.lay-main.vis-soft .hero-quiet .glyph { background: var(--surface); }
/* on the tinted card the capsule fill would melt into the wash: dot + word only, like B's pass card */
.lay-main.vis-soft .hero .badge { background: transparent; padding-left: 0; padding-right: 0; }
.lay-main.vis-soft .hero-figure { margin-top: 12px; }
.lay-main.vis-soft .hero-models { margin-top: 16px; border-radius: 16px; padding: 11px 14px; }
.lay-main.vis-soft .hero-error { font-weight: 500; }

/* buttons: pills; secondary floats on a white card */
.lay-main.vis-soft .actions { gap: 10px; }
.lay-main.vis-soft .act { height: 48px; border-radius: 24px; border: 0; background: var(--surface); color: var(--ink1); box-shadow: var(--vs-card); }
.lay-main.vis-soft .act-primary { background: var(--accent-fill); color: var(--on-accent); box-shadow: var(--vs-primary); }
.lay-main.vis-soft .act-small { height: 32px; padding: 0 13px; border-radius: 16px; background: var(--accent-wash); color: var(--accent); box-shadow: none; font-size: 14px; }
/* small pills keep A's hierarchy: secondary = cyan wash (B's 测试 / 恢复状态 pill), primary = solid cyan */
.lay-main.vis-soft .act-small.act-primary { background: var(--accent-fill); color: var(--on-accent); }
.lay-main.vis-soft .submit { box-shadow: var(--vs-primary); }
.lay-main.vis-soft .submit:disabled { box-shadow: none; }
/* inside a sheet the submit sits on the scroller's bottom edge, where a drop shadow would be clipped into a band */
.lay-main.vis-soft .sheet .submit { box-shadow: none; }

/* chips & segmented */
.lay-main.vis-soft .chips { padding: 6px 16px 14px; }
.lay-main.vis-soft .chip { height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--surface); box-shadow: var(--vs-chip); font-weight: 500; }
.lay-main.vis-soft .chip b { font-family: var(--num-font); }
.lay-main.vis-soft .chip.on { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.lay-main.vis-soft .chip.on b { color: inherit; opacity: .85; }
.lay-main.vis-soft .token-add { background: transparent; box-shadow: none; border: 1.5px dashed var(--rule-strong); color: var(--ink2); }
.lay-main.vis-soft .seg { border-radius: 14px; padding: 3px; }
.lay-main.vis-soft .seg-item { height: 36px; border-radius: 11px; }
.lay-main.vis-soft .seg-item.on { box-shadow: 0 1px 2px rgba(20, 24, 27, .08), 0 3px 8px rgba(20, 24, 27, .06); }
.lay-main.vis-soft.dark .seg-item.on { box-shadow: none; }
.lay-main.vis-soft .search-field { height: 42px; border-radius: 21px; background: var(--surface); box-shadow: var(--vs-chip); }
.lay-main.vis-soft .search-field.big { height: 48px; border-radius: 24px; }
.lay-main.vis-soft .sheet-body > .search-field { flex: none; } /* keep its height inside the scrolling sheet body */

/* small parts */
.lay-main.vis-soft .avatar { width: 28px; height: 28px; margin-left: 0; border-radius: 14px; background: var(--sunken); color: var(--ink1); font-size: 13.5px; }
.lay-main.vis-soft .code { border-radius: 7px; }
.lay-main.vis-soft .rq-step { width: 28px; height: 28px; border-radius: 14px; font-size: 13px; }
.lay-main.vis-soft .kv { border-bottom: 0; padding: 10px 0; }
.lay-main.vis-soft .kv-label { font-size: 12.5px; }
.lay-main.vis-soft small[data-kind]::before { width: 8px; height: 8px; border: 0; border-radius: 4px; background: var(--lg-actual); vertical-align: 0; }
.lay-main.vis-soft small[data-kind="cost"]::before { border: 0; background: var(--lg-cost); }
.lay-main.vis-soft small[data-kind="standard"]::before { border: 0; background: var(--lg-standard); }

/* bars: thicker, round ends, no vernier notches */
.lay-main.vis-soft .cap-track::after { display: none; }
.lay-main.vis-soft .cap-over .cap-track { box-shadow: none; }
.lay-main.vis-soft .health-scale { height: 8px; border-radius: 4px; }
.lay-main.vis-soft .health-fill { border-radius: 4px; }
.lay-main.vis-soft .health-needle { width: 3px; margin-left: -1.5px; border-radius: 2px; }
.lay-main.vis-soft .strip18 { gap: 2px; }
.lay-main.vis-soft .strip18 i { height: 13px; border-radius: 3px; }
.lay-main.vis-soft .chart-bar { rx: 3px; } /* round tops only — the bars keep A's full data contrast */
.lay-main.vis-soft .lg-today { width: 8px !important; height: 8px !important; border-radius: 4px; }
.lay-main.vis-soft .rq-bar { height: 10px; border-radius: 5px; }
.lay-main.vis-soft .rq-timing-legend small::before { border-radius: 4px; }

/* monitor summary tiles */
.lay-main.vis-soft .chan-summary { gap: 10px; margin-bottom: 26px; }
.lay-main.vis-soft .chan-stat { border-radius: 18px; padding: 11px 12px 10px; }
.lay-main.vis-soft .chan-stat .readout-l { font-size: 26px; }

/* request detail, banners, sheets */
.lay-main.vis-soft .rq-cost { border-top: 1px dashed var(--hairline); padding-top: 14px; margin-top: 16px; }
.lay-main.vis-soft .rq-error { border-radius: 14px; padding: 12px 14px; }
.lay-main.vis-soft .banner,
.lay-main.vis-soft .banner.rail { margin: 2px 16px 16px; border-radius: 20px; padding: 14px 12px 14px 16px; background: var(--tone-wash); }
.lay-main.vis-soft .stream,
.lay-main.vis-soft .result { border-radius: 18px; }
.lay-main.vis-soft .kp-key { height: 56px; border-radius: 18px; font-family: var(--num-font); }
.lay-main.vis-soft .kp-pill { height: 36px; border-radius: 18px; background: var(--surface); box-shadow: var(--vs-chip); }
.lay-main.vis-soft .kp-avatar { background: var(--surface); box-shadow: var(--vs-chip); }

/* =====================================================================
   vis-mid · 折中
   ===================================================================== */

.lay-main.vis-mid {
  /* standard-width SF Pro (Segoe UI Variable in the preview) instead of A's condensed DIN-like readouts */
  --num-font: "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --readout-font: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --money-font: var(--num-font);
  --money-xl-font: 500 42px/1.05 var(--readout-font);
  --amount-font: 500 52px/1.1 var(--readout-font);
  --panel-radius: 18px;
  --badge-radius: 11px;
  --chip-radius: 17px;
  --btn-radius: 14px;
  --cap-radius: 3px;
  --cap-h: 6px;
  --readout-weight: 500;
  --row-title-weight: 600;
  --vm-lift: 0 1px 2px rgba(20, 24, 27, .05), 0 1px 1px rgba(20, 24, 27, .03);
  --vm-line: color-mix(in srgb, var(--hairline) 70%, transparent);
}
.lay-main.vis-mid.light { --btn-bg: var(--surface); }
.lay-main.vis-mid.dark { --vm-lift: none; }

/* numerals: standard-width SF Pro, medium weight (A uses condensed readouts, soft uses rounded semibold) */
.lay-main.vis-mid .readout,
.lay-main.vis-mid .money-xl,
.lay-main.vis-mid .money-l,
.lay-main.vis-mid .strip-side b,
.lay-main.vis-mid .kp-amount,
.lay-main.vis-mid .rq-cost b { font-family: var(--readout-font); font-stretch: 100%; font-weight: 500; letter-spacing: -.01em; }
.lay-main.vis-mid .money-l { font-size: 21px; }
.lay-main.vis-mid .strip-side b { font-size: 20px; }
.lay-main.vis-mid .hero .readout-xl { font-size: 50px; }
.lay-main.vis-mid .kp-amount { font-size: 62px; }
.lay-main.vis-mid .rq-cost b { font-size: 21px; }

/* section heads: a plain dark title, no rule (between A's grey label and B's big heading) */
.lay-main.vis-mid .sec-wrap { margin-bottom: 24px; }
.lay-main.vis-mid .sec-head { padding: 0 4px 9px; }
.lay-main.vis-mid .sec-title { font-size: 16px; font-weight: 600; color: var(--ink1); }
.lay-main.vis-mid .sec-line { background: none; }
.lay-main.vis-mid .sec-meta { color: var(--ink3); font-weight: 500; }

/* panels: no hairline frame, a whisper of lift in light mode */
.lay-main.vis-mid .sec,
.lay-main.vis-mid .hero,
.lay-main.vis-mid .hero-quiet,
.lay-main.vis-mid .chan-stat { border: 0; box-shadow: var(--vm-lift); }
.lay-main.vis-mid .hero, .lay-main.vis-mid .hero-quiet { border-radius: 20px; }
.lay-main.vis-mid .hero-models { border-radius: 12px; }

/* softer hairlines */
.lay-main.vis-mid .row + .row::before { opacity: .7; right: 14px; }
.lay-main.vis-mid .kv { border-bottom-color: var(--vm-line); }
.lay-main.vis-mid .cap-line + .cap-line,
.lay-main.vis-mid .ledger-line + .ledger-line { border-top-color: var(--vm-line); }
.lay-main.vis-mid .rq-cost { border-top-color: var(--vm-line); }
.lay-main.vis-mid .list-head { font-size: 13px; letter-spacing: 0; padding: 14px 16px 6px; }
.lay-main.vis-mid .list-head b.lg-head-cols { font-size: 12px; }

/* status spine: inset, round-ended bar instead of a full-height stripe */
.lay-main.vis-mid .rail { background: none; }
.lay-main.vis-mid .rail.tappable:hover { background: var(--hover-row); }
.lay-main.vis-mid .hero.rail { background: var(--surface); }
.lay-main.vis-mid .rail::after { content: ''; position: absolute; left: 5px; top: 14px; bottom: 14px; width: 3px; border-radius: 2px; background: var(--tone); }
.lay-main.vis-mid .hero.rail::after { left: 6px; top: 18px; bottom: 18px; width: 4px; }

/* lamp plates: A's glyph inside B's capsule */
.lay-main.vis-mid .badge { height: 22px; padding: 0 9px 0 7px; border-radius: 11px; gap: 4px; }
.lay-main.vis-mid .badge-big { height: 28px; padding: 0 12px 0 10px; border-radius: 14px; }

/* buttons & chips */
.lay-main.vis-mid .act { border: 0; box-shadow: var(--vm-lift); }
.lay-main.vis-mid .act-primary { box-shadow: none; }
.lay-main.vis-mid .act-small { border-radius: 15px; }
.lay-main.vis-mid .sec .act-small:not(.act-primary) { background: var(--sunken); box-shadow: none; } /* white-on-white inside cards would vanish; the primary keeps its solid cyan */
.lay-main.vis-mid .chip { border: 0; }
.lay-main.vis-mid .chip.on { background: var(--accent-wash); color: var(--accent); }
.lay-main.vis-mid .chip.on b { color: inherit; }
.lay-main.vis-mid .token-add { border: 1px dashed var(--rule-strong); }
.lay-main.vis-mid .seg { border-radius: 12px; }
.lay-main.vis-mid .seg-item { border-radius: 9px; }
.lay-main.vis-mid .search-field { border-radius: 12px; }
.lay-main.vis-mid .search-field.big { border-radius: 14px; }
.lay-main.vis-mid .sheet-body > .search-field { flex: none; } /* keep its height inside the scrolling sheet body */

/* small parts */
.lay-main.vis-mid .avatar { border-radius: 15px; }
.lay-main.vis-mid .code { border-radius: 6px; }
.lay-main.vis-mid .chan-stat { border-radius: 14px; }
.lay-main.vis-mid .cap-track::after { display: none; }
.lay-main.vis-mid .strip18 i { border-radius: 2px; height: 11px; }
.lay-main.vis-mid .health-fill { border-radius: 3px; }
.lay-main.vis-mid .chart-bar { rx: 2px; }
.lay-main.vis-mid .rq-bar { border-radius: 4px; }
.lay-main.vis-mid .rq-error { border-radius: 12px; }
.lay-main.vis-mid .banner,
.lay-main.vis-mid .banner.rail { border-radius: 16px; background: var(--tone-wash); }
.lay-main.vis-mid .kp-key { border-radius: 16px; }
